<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12322A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G">
<title>Felipe & Gabriela</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --tinta:#12322A; --tinta2:#1D4A3E; --vinho:#3B1B27;
  --papel:#F2EEE4; --carta:#FFFFFF;
  --rosa:#B4566A; --ouro:#BE8724; --cinza:#6E7C74; --verde:#2E7D52;
  --linha:rgba(18,50,42,.13);
  --display:'Fraunces',Georgia,serif;
  --texto:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--tinta);font-family:var(--texto);color:var(--tinta);font-size:15px;line-height:1.45}
#shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--papel);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:92px;position:relative}

header{background:var(--tinta);color:var(--papel);padding:calc(18px + env(safe-area-inset-top)) 20px 20px;transition:background .2s}
header.casamento{background:var(--vinho)}
.cab-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(242,238,228,.6);margin:0 0 6px;font-weight:500;display:flex;align-items:center;gap:8px}
.eyebrow .ver{letter-spacing:.04em;text-transform:none;font-size:10px;color:rgba(242,238,228,.42);padding-left:8px;border-left:1px solid rgba(242,238,228,.2)}
header h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
.ajustes-btn{background:rgba(242,238,228,.12);border:0;color:var(--papel);width:34px;height:34px;border-radius:99px;font-size:16px;cursor:pointer;flex:none}
.headline{margin-top:13px;border-top:1px solid rgba(242,238,228,.18);padding-top:12px;display:flex;align-items:baseline;gap:9px}
.headline b{font-family:var(--display);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.headline span{font-size:12px;color:rgba(242,238,228,.7)}

main{padding:16px 16px 8px}
.secao-titulo{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:22px 2px 9px}
.secao-titulo:first-child{margin-top:2px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:11px}

.topo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:10px}
.rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.val{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-.02em;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.barra{height:11px;border-radius:99px;background:rgba(18,50,42,.09);display:flex;overflow:hidden}
.barra i{display:block;height:100%}
.legenda{display:flex;gap:15px;margin-top:11px;flex-wrap:wrap}
.legenda div{font-size:11.5px;color:var(--cinza);display:flex;align-items:center;gap:6px}
.legenda em{width:8px;height:8px;border-radius:99px;display:inline-block;font-style:normal}
.legenda b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mini{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:13px 14px}
.mini .num{font-family:var(--display);font-size:22px;font-weight:500;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini .pe{font-size:11.5px;color:var(--cinza);margin-top:1px}

.linha-item{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:10px 8px 10px 12px;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.linha-item .corpo{flex:1;min-width:0}
.linha-item .nome{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-item .sub{font-size:12px;color:var(--cinza);margin-top:2px}
.linha-item .valor{font-family:var(--display);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}

.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(18,50,42,.07);color:var(--cinza)}
.tag.noiva{background:rgba(180,86,106,.12);color:var(--rosa)}
.tag.noivo{background:rgba(29,74,62,.12);color:var(--tinta2)}
.tag.ok{background:rgba(46,125,82,.14);color:var(--verde)}

.x{border:0;background:transparent;color:var(--cinza);font-size:20px;line-height:1;padding:4px 6px;border-radius:8px;cursor:pointer;flex:none}
.x:hover{background:rgba(180,86,106,.12);color:var(--rosa)}

.cat{background:var(--carta);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.cat>summary::-webkit-details-marker{display:none}
.cat .cnome{font-weight:600;flex:1;min-width:0}
.cat .cval{font-family:var(--display);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .seta{color:var(--cinza);font-size:12px;transition:transform .18s;flex:none}
.cat[open] .seta{transform:rotate(90deg)}
.cot{border-top:1px solid var(--linha);padding:12px 14px}
.cot.escolhida{background:rgba(190,135,36,.08);box-shadow:inset 3px 0 0 var(--ouro)}
.cot-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cot-acoes{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.escolher{border:1px solid var(--linha);background:transparent;color:var(--tinta);padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--texto);white-space:nowrap}
.escolher.on{background:var(--ouro);border-color:var(--ouro);color:#fff}
.apagar{border:0;background:transparent;color:var(--cinza);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--texto);padding:7px 8px;border-radius:8px;margin-left:auto}
.apagar:hover{color:var(--rosa);background:rgba(180,86,106,.1)}

.form.edicao{border:1px solid var(--tinta2);border-left:3px solid var(--tinta2);border-style:solid}
.edit-tit{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);font-weight:600;margin-bottom:12px}
.lapis{border:0;background:transparent;color:var(--cinza);font-size:15px;padding:4px 6px;border-radius:8px;cursor:pointer;flex:none}
.lapis:hover{background:rgba(29,74,62,.1);color:var(--tinta)}

.catbox{border-top:1px solid var(--linha)}
.catbox:first-child{border-top:0}
.catbox>summary{list-style:none;cursor:pointer;padding:11px 0}
.catbox>summary::-webkit-details-marker{display:none}
.catlin{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;align-items:baseline;gap:8px}
.catlin .nm{display:flex;align-items:center;gap:7px;min-width:0}
.catlin .sta{color:var(--cinza);font-size:11px;transition:transform .18s;flex:none}
.catbox[open] .sta{transform:rotate(90deg)}
.catlin b{font-variant-numeric:tabular-nums;white-space:nowrap}
.catlin .pc{font-size:11px;color:var(--cinza);font-weight:400;margin-left:4px}
.mensal{padding:4px 0 12px 16px}
.mlin{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cinza);margin-bottom:5px}
.mlin .mn{width:26px;flex:none}
.mlin .mt{flex:1;height:6px;background:rgba(18,50,42,.07);border-radius:99px;overflow:hidden}
.mlin .mt i{display:block;height:100%;background:var(--ouro);border-radius:99px}
.mlin .mv{width:78px;text-align:right;font-variant-numeric:tabular-nums;flex:none}

.saldo{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:11px}
.barra2{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(18,50,42,.08);margin:14px 0 12px}
.barra2 i{display:block;height:100%}
.fluxo{display:flex;gap:12px}
.fluxo>div{flex:1}
.fluxo .rt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600;display:flex;align-items:center;gap:5px}
.fluxo .vl{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;margin-top:3px}
.pt{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.linha-item .valor.ent{color:var(--verde)}
.tag.rec{background:rgba(46,125,82,.13);color:var(--verde)}
.form.entrada{border-color:rgba(46,125,82,.4)}
.form.entrada.edicao-g{border:1px solid var(--verde);border-left:3px solid var(--verde);border-style:solid}
.btn.verde{background:var(--verde);color:#fff}
.chip.verde[aria-pressed="true"]{background:var(--verde);border-color:var(--verde)}

.reparte{display:flex;border-top:1px solid var(--linha);margin-top:12px;padding-top:12px}
.reparte>div{flex:1;text-align:center;border-left:1px solid var(--linha)}
.reparte>div:first-child{border-left:0}
.reparte .rr{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.reparte .vv{font-family:var(--display);font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
.linha-item.fx{border-left:3px solid var(--ouro)}
.linha-item.pc{border-left:3px solid var(--rosa)}
.tag.fixa{background:rgba(190,135,36,.16);color:#8A6212}
.tag.parc{background:rgba(180,86,106,.13);color:var(--rosa)}
.form.fixa-edit{border-style:solid;border-color:var(--ouro);border-left:3px solid var(--ouro)}
.btn.ouro{background:var(--ouro);color:#fff}
.grade4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.grade4 .mini{padding:11px 5px;text-align:center;font-family:var(--texto);cursor:pointer;width:100%;display:block;transition:box-shadow .15s,background .15s}
.grade4 .mini .num{font-family:var(--display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.grade4 .mini .pe{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin-top:4px}
.grade4 .mini.sel{border-color:var(--vinho);background:rgba(59,27,39,.05);box-shadow:inset 0 0 0 1px var(--vinho)}
.grade4 .mini.v.sel{border-color:var(--verde);background:rgba(46,125,82,.06);box-shadow:inset 0 0 0 1px var(--verde)}
.grade4 .mini.o.sel{border-color:var(--ouro);background:rgba(190,135,36,.07);box-shadow:inset 0 0 0 1px var(--ouro)}
.grade4 .mini.esp.sel{border-color:#4A6FA5;background:rgba(74,111,165,.08);box-shadow:inset 0 0 0 1px #4A6FA5}
.busca{position:relative;margin-bottom:11px}
.busca input{padding-left:34px}
.busca .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--cinza);font-size:15px}
.acoes{display:flex;align-items:center;gap:2px;flex:none}
.st{border:0;background:transparent;color:#A9B2AD;width:29px;height:29px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.st:hover{background:rgba(18,50,42,.06);color:var(--cinza)}
.st.confirmado.on{background:rgba(46,125,82,.14);color:var(--verde)}
.st.recusou.on{background:rgba(180,86,106,.14);color:var(--rosa)}
.st.espera.on{background:rgba(74,111,165,.16);color:#3B5C8A}
.st.del:hover{background:rgba(180,86,106,.12);color:var(--rosa)}
.sep{width:1px;height:16px;background:var(--linha);margin:0 3px;flex:none}
.linha-item.espera{border-left:3px solid #4A6FA5;background:rgba(74,111,165,.04)}
.linha-item.recusou{opacity:.5}
.tag.ambos{background:rgba(190,135,36,.14);color:#8A6212}
.tag.esp{background:rgba(74,111,165,.15);color:#3B5C8A}
.kid{display:inline-block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(74,111,165,.14);color:#3B5C8A;vertical-align:1px;margin-right:2px}
.chip.lim{border-style:dashed;color:var(--rosa);border-color:rgba(180,86,106,.4)}
.edt{color:#C3C9C5;font-size:12px;margin-left:2px}
.nome:hover .edt{color:var(--vinho)}
.linha-item.edit-conv{display:block;border-color:var(--vinho);border-left:3px solid var(--vinho);border-radius:0;padding:13px}
.cats-chips{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip{display:inline-flex;align-items:center;gap:3px;background:var(--papel);border:1px solid var(--linha);border-radius:99px;padding:6px 6px 6px 13px;font-size:13px;font-weight:500}
.cat-chip button{border:0;background:transparent;color:var(--cinza);font-size:16px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:99px;font-family:var(--texto)}
.cat-chip button:hover{background:rgba(180,86,106,.14);color:var(--rosa)}

.form{background:var(--carta);border:1px dashed rgba(18,50,42,.25);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--linha);border-radius:10px;font-family:var(--texto);font-size:16px;color:var(--tinta);background:var(--papel)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tinta2);outline-offset:1px}
.campo{margin-bottom:10px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--tinta);color:var(--papel);font-family:var(--texto);font-size:14px;font-weight:600;cursor:pointer}
.btn.claro{background:transparent;color:var(--tinta);border:1px solid var(--linha)}
.btn.rosa{background:var(--vinho)}

.chips{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:transparent;color:var(--cinza);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--texto)}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip.rosa[aria-pressed="true"]{background:var(--vinho);border-color:var(--vinho)}

.navmes{display:flex;align-items:center;justify-content:space-between;background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.navmes button{border:0;background:transparent;font-size:19px;color:var(--tinta);cursor:pointer;padding:3px 12px;border-radius:8px;line-height:1}
.navmes span{font-weight:600;font-size:14px}

.mes{font-family:var(--display);font-size:15px;font-weight:500;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.mes span{font-family:var(--texto);font-size:12px;color:var(--cinza);font-variant-numeric:tabular-nums}
.vazio{text-align:center;color:var(--cinza);font-size:13.5px;padding:26px 14px;border:1px dashed var(--linha);border-radius:14px;margin-bottom:11px}

.marca{width:20px;height:20px;border-radius:99px;border:1.5px solid var(--linha);flex:none;cursor:pointer;background:transparent;padding:0}
.marca.on{border-color:var(--ouro);background:var(--ouro);box-shadow:inset 0 0 0 3px var(--carta)}

.hbar{margin-bottom:11px}
.hbar .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .l b{font-variant-numeric:tabular-nums;font-weight:600}
.hbar .t{height:8px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}

table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:right;padding:0 0 7px;font-weight:600}
table.res th:first-child{text-align:left}
table.res td{padding:8px 0;border-top:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums}
table.res td:first-child{text-align:left;font-weight:500}

nav{position:fixed;bottom:0;left:0;right:0;max-width:470px;margin:0 auto;background:var(--carta);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:transparent;padding:13px 1px 15px;cursor:pointer;font-family:var(--texto);font-size:10.5px;font-weight:600;color:var(--cinza);position:relative}
nav button[aria-current="true"]{color:var(--tinta)}
nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--tinta);border-radius:0 0 3px 3px}
nav button.gan[aria-current="true"]{color:var(--verde)}
nav button.gan[aria-current="true"]::before{background:var(--verde)}
nav button.cas[aria-current="true"]{color:var(--vinho)}
nav button.cas[aria-current="true"]::before{background:var(--rosa)}
nav .divisor{width:1px;background:var(--linha);margin:12px 0}

#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:var(--papel);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;background:rgba(18,50,42,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .painel{background:var(--papel);width:100%;max-width:470px;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.modal h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0 0 4px}
.sinc{font-size:11.5px;color:var(--cinza);display:flex;align-items:center;gap:6px;margin-top:10px}
.sinc em{width:7px;height:7px;border-radius:99px;background:var(--cinza);display:inline-block;flex:none}
.sinc em.on{background:#2E9E5B}
.sinc em.con{background:var(--ouro)}
.sinc em.off{background:var(--rosa)}

.selo-sinc{width:9px;height:9px;border-radius:99px;background:rgba(242,238,228,.3);display:inline-block;flex:none}
.selo-sinc.on{background:#5FD08A}
.selo-sinc.con{background:#E8B34A;animation:pisca 1.1s ease-in-out infinite}
.selo-sinc.off{background:#E8899C}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="shell">
  <header id="cab">
    <div class="cab-topo">
      <div>
        <p class="eyebrow"><span id="eyebrow"></span><span class="ver">v<span id="verNum"></span></span></p>
        <h1 id="titulo"></h1>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:none">
        <span class="selo-sinc" id="seloTopo" title="Salvando neste aparelho"></span>
        <button class="ajustes-btn" onclick="abrirAjustes()" aria-label="Ajustes">⚙</button>
      </div>
    </div>
    <div class="headline"><b id="hNum"></b><span id="hTxt"></span></div>
  </header>
  <main id="tela"></main>
  <nav id="nav"></nav>
</div>

<div id="toast"></div>

<div class="modal" id="modalAjustes" onclick="if(event.target===this)fecharAjustes()">
  <div class="painel" id="painelAjustes"></div>
</div>

<script>
"use strict";

/* ==========================================================
   CONFIGURAÇÃO DO FIREBASE
   Preencha os quatro valores abaixo. Depois disso o app salva
   sozinho na nuvem — quem abrir o link não configura nada.
   ========================================================== */
const FIREBASE = {
  apiKey:      "AIzaSyCQHdux0E8jJg-CQvgthPKUjPGave8M1Gs",
  authDomain:  "casamento-cunhas.firebaseapp.com",
  databaseURL: "https://casamento-cunhas-default-rtdb.firebaseio.com",
  projectId:   "casamento-cunhas"
};

let fbRef=null, timerSalvar=null, ignorar=false, pendente=false;
let estado='local';   // local | conectando | online | offline | erro

const configOk = () => FIREBASE.databaseURL.indexOf('COLE_AQUI')<0 && FIREBASE.apiKey.indexOf('COLE_AQUI')<0;

function lerLocal(){
  try{ const t=localStorage.getItem(CHAVE); return t?JSON.parse(t):null; }catch(e){ return null; }
}
function gravarLocal(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(D)); }catch(e){}
}
function salvar(){
  D.atualizadoEm = Date.now();
  gravarLocal();
  if(!fbRef){ pendente=configOk(); return marcar(estado); }
  pendente=true; marcar('salvando');
  clearTimeout(timerSalvar);
  timerSalvar=setTimeout(enviar,500);
}
function enviar(){
  if(!fbRef) return;
  ignorar=true;
  fbRef.set(D)
    .then(()=>{ pendente=false; marcar('online'); })
    .catch(()=>{ marcar('offline'); });
}

function carregarFirebase(){
  if(!configOk()){ marcar('local'); return; }
  marcar('conectando');
  const urls=[
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'
  ];
  let i=0;
  (function proximo(){
    if(i>=urls.length) return iniciarFirebase();
    const s=document.createElement('script');
    s.src=urls[i++]; s.onload=proximo; s.onerror=()=>marcar('offline');
    document.head.appendChild(s);
  })();
}

function iniciarFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE);
    const db=firebase.database();
    fbRef=db.ref('casamentos/'+SALA);

    db.ref('.info/connected').on('value', s=>{
      if(s.val()===true){ marcar(pendente?'salvando':'online'); if(pendente) enviar(); }
      else marcar('offline');
    });

    fbRef.on('value', snap=>{
      if(ignorar){ ignorar=false; return; }
      const v=snap.val();
      if(v && v.versao){
        const meu=D.atualizadoEm||0, dele=v.atualizadoEm||0;
        if(dele>=meu){ D=normalizar(v); if(importarLista()) salvar(); gravarLocal(); render(); }
        else enviar();                       // o do aparelho é mais novo
      } else {
        enviar();                            // primeira vez: sobe o que existe aqui
      }
      marcar(pendente?'salvando':'online');
    }, ()=>marcar('erro'));
  }catch(e){ marcar('erro'); }
}

function normalizar(v){
  const padrao=estadoInicial();
  const catsPadrao=padrao.categorias;
  const padraoFixas=padrao.fixas;
  const r=Object.assign(padrao,v);
  r.gastos=Array.isArray(v.gastos)?v.gastos:[];
  r.convidados=Array.isArray(v.convidados)?v.convidados:[];
  r.convidados.forEach(c=>{ if(c.crianca===undefined) c.crianca=false; if(!c.lado) c.lado='noiva'; if(!c.status) c.status='pendente'; if(c.acomp===undefined) c.acomp=0; });
  r.listaImportada=!!v.listaImportada;
  r.categorias=(Array.isArray(v.categorias)&&v.categorias.length)?v.categorias:catsPadrao;
  r.categorias.forEach(c=>{ if(!Array.isArray(c.cotacoes)) c.cotacoes=[]; });
  r.parcelasPagas=Array.isArray(v.parcelasPagas)?v.parcelasPagas:[];
  r.catsGasto=(Array.isArray(v.catsGasto)&&v.catsGasto.length)?v.catsGasto:CATS_PADRAO.slice();
  r.gastos.forEach(g=>{ if(g.cat && r.catsGasto.indexOf(g.cat)<0) r.catsGasto.push(g.cat); });
  r.ganhos=Array.isArray(v.ganhos)?v.ganhos:[];
  r.fontes=(Array.isArray(v.fontes)&&v.fontes.length)?v.fontes:FONTES_PADRAO.slice();
  r.ganhos.forEach(g=>{ if(g.fonte && r.fontes.indexOf(g.fonte)<0) r.fontes.push(g.fonte); });
  r.fixas=Array.isArray(v.fixas)?v.fixas:padraoFixas;
  r.fixas.forEach(f=>{ if(!f.ajustes||typeof f.ajustes!=='object') f.ajustes={}; if(f.ativa===undefined) f.ativa=true; });
  r.fixasPagas=Array.isArray(v.fixasPagas)?v.fixasPagas:[];
  r.fixas.forEach(f=>{ if(f.cat && r.catsGasto.indexOf(f.cat)<0) r.catsGasto.push(f.cat); });
  return r;
}

function chaveConv(c){
  return String(c.nome||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()
    +'|'+String(c.grupo||'').toLowerCase().trim();
}
function importarLista(){
  if(D.listaImportada) return 0;
  if(!Array.isArray(D.convidados)) D.convidados=[];
  const jaTem={};
  D.convidados.forEach(c=>{ jaTem[chaveConv(c)]=1; });
  let n=0;
  LISTA_INICIAL.forEach(c=>{
    if(jaTem[chaveConv(c)]) return;
    D.convidados.push({id:novoId(),nome:c.nome,grupo:c.grupo,lado:c.lado,
      acomp:0,status:'pendente',crianca:!!c.crianca});

  });
  D.listaImportada=true;

}

const pagasSet = () => new Set(D.parcelasPagas||[]);

function parcelasDe(g){
  const out=[]; const p=g.data.split('-').map(Number);
  const v = g.valor/g.parcelas;
  for(let i=0;i<g.parcelas;i++){
    const ultimoDia=new Date(p[0], p[1]+i, 0).getDate();
    const dt=new Date(p[0], p[1]-1+i, Math.min(p[2], ultimoDia));
    out.push({chave:g.id+'-'+(i+1),desc:g.desc,n:i+1,de:g.parcelas,valor:v,dt,forma:g.forma,cat:g.cat});
  }
  return out;
}
const todasParcelas = () => D.gastos.filter(g=>g.parcelado).flatMap(parcelasDe).sort((a,b)=>a.dt-b.dt);

const valorFixa=(f,k)=>(f.ajustes&&f.ajustes[k]!==undefined)?f.ajustes[k]:(f.valor||0);

function itensDoMes(k){
  const out=[];
  D.gastos.forEach(g=>{
    if(!g.parcelado){
      if((g.data||'').slice(0,7)===k)
        out.push({tipo:'vista',g,id:g.id,valor:g.valor,forma:g.forma,cat:g.cat,desc:g.desc,data:g.data});
    } else parcelasDe(g).forEach(p=>{
      if(chaveMes(p.dt)===k)
        out.push({tipo:'parcela',g,id:g.id,valor:p.valor,forma:g.forma,cat:g.cat,desc:g.desc,
          data:k+'-'+String(p.dt.getDate()).padStart(2,'0'),n:p.n,de:p.de,chave:p.chave});
    });
  });
  (D.fixas||[]).forEach(f=>{
    if(f.ativa===false) return;
    if(f.inicio && k<f.inicio) return;
    const v=valorFixa(f,k);
    out.push({tipo:'fixa',f,id:f.id,valor:v,forma:f.forma,cat:f.cat,desc:f.nome,
      data:k+'-'+String(f.dia||1).padStart(2,'0'),chave:f.id+'-'+k});
  });
  return out.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
const fluxoMes = k => itensDoMes(k).reduce((s,i)=>s+i.valor,0);

function itensGanhoMes(k){
  const out=[];
  (D.ganhos||[]).forEach(g=>{
    if(!g.repete){ if((g.data||'').slice(0,7)===k) out.push({g,valor:g.valor,fonte:g.fonte}); }
    else {
      const p=g.data.split('-').map(Number), n=g.vezes||12;
      for(let i=0;i<n;i++){
        const ult=new Date(p[0],p[1]+i,0).getDate();
        const dt=new Date(p[0],p[1]-1+i,Math.min(p[2],ult));
        if(chaveMes(dt)===k){ out.push({g,valor:g.valor,fonte:g.fonte}); break; }
      }
    }
  });
  return out;
}
const entradasMes = k => itensGanhoMes(k).reduce((s,i)=>s+i.valor,0);

function mesesDoAno(a){ const r=[]; for(let m=1;m<=12;m++) r.push(a+'-'+String(m).padStart(2,'0')); return r; }
function agregaAno(a,fn,campo){
  const tot={},mensal={};
  mesesDoAno(a).forEach((k,mi)=>{
    fn(k).forEach(i=>{
      const c=i[campo]||'Outros';
      tot[c]=(tot[c]||0)+i.valor;
      mensal[c]=mensal[c]||Array(12).fill(0);
      mensal[c][mi]+=i.valor;
    });
  });
  return {tot,mensal};
}

function telaInicio(){
  const k=chaveMes(agora());
  const p=k.split('-'); const ant=chaveMes(new Date(+p[0],+p[1]-2,1));
  const totalMes=fluxoMes(k), totalAnt=fluxoMes(ant);
  const dif = totalAnt? ((totalMes-totalAnt)/totalAnt)*100 : 0;
  const itens=itensDoMes(k);
  const porForma={}; itens.forEach(i=>porForma[i.forma]=(porForma[i.forma]||0)+i.valor);
  const pagas=pagasSet();
  const abertas=todasParcelas().filter(x=>!pagas.has(x.chave));
  const hoje=agora(); hoje.setHours(0,0,0,0);
  const proximas=abertas.filter(x=>x.dt>=hoje).slice(0,3);
  const diasNoMes=new Date(+p[0],+p[1],0).getDate();

  if(!D.gastos.length && !(D.ganhos||[]).length){
    return `<div class="vazio" style="padding:40px 20px">
      <div style="font-family:var(--display);font-size:19px;color:var(--tinta);margin-bottom:6px">Tudo pronto para começar</div>
      Lance um gasto ou um recebimento e este resumo se monta sozinho.
    </div>
    <div class="dupla">
      <button class="btn claro" onclick="ir('gastos')">Lançar gasto</button>
      <button class="btn verde" onclick="ir('ganhos')">Lançar recebimento</button>
    </div>`;
  }

  const ent=entradasMes(k), saldo=ent-totalMes;
  const larg=Math.max(ent,totalMes)||1;

  return `
  <div class="secao-titulo">${rotuloMes(k)}</div>
  <div class="saldo">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><span class="rot">${saldo>=0?'Sobrou no mês':'Faltou no mês'}</span>
        <b class="val" style="color:${saldo>=0?'var(--verde)':'var(--rosa)'}">${R$(Math.abs(saldo))}</b></div>
      ${ent?`<div style="text-align:right"><span class="rot">do que entrou</span>
        <b class="val" style="font-size:17px;color:var(--cinza)">${((saldo/ent)*100).toFixed(0)}%</b></div>`:''}
    </div>
    <div class="barra2">
      <i style="width:${(ent/larg)*50}%;background:var(--verde)"></i>
      <i style="width:${Math.max(100-(ent/larg)*50-(totalMes/larg)*50,0)}%;background:transparent"></i>
      <i style="width:${(totalMes/larg)*50}%;background:var(--rosa)"></i>
    </div>
    <div class="fluxo">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou</div><div class="vl">${R$(ent)}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(totalMes)}</div></div>
    </div>
  </div>

  <div class="cartao">
    <div class="topo">
      <div><span class="rot">Gasto no mês</span><b class="val" style="font-size:21px">${R$(totalMes)}</b></div>
      ${totalAnt?`<div style="text-align:right"><span class="rot">vs. mês anterior</span>
        <b class="val" style="font-size:17px;color:${dif>0?'var(--rosa)':'var(--tinta2)'}">${dif>0?'+':''}${dif.toFixed(0)}%</b></div>`:''}
    </div>
    <div class="barra">${Object.keys(FORMAS).map(f=>`<i style="width:${((porForma[f]||0)/(totalMes||1))*100}%;background:${COR_FORMA[f]}"></i>`).join('')}</div>
    <div class="legenda">${Object.keys(FORMAS).map(f=>`<div><em style="background:${COR_FORMA[f]}"></em>${FORMAS[f]} <b>${R$(porForma[f]||0)}</b></div>`).join('')}</div>
  </div>

  <div class="grade">
    <div class="mini"><div class="rot">Fatura do cartão</div><div class="num">${R$(porForma.credito||0)}</div><div class="pe">crédito no mês</div></div>
    <div class="mini"><div class="rot">Parcelas em aberto</div><div class="num">${R$(abertas.reduce((s,x)=>s+x.valor,0))}</div><div class="pe">${abertas.length} parcela(s)</div></div>
    <div class="mini"><div class="rot">Lançamentos</div><div class="num">${itens.length}</div><div class="pe">no mês</div></div>
    <div class="mini"><div class="rot">Média por dia</div><div class="num">${R$(totalMes/diasNoMes)}</div><div class="pe">no mês</div></div>
  </div>

  ${itensGanhoMes(k).length?`<div class="secao-titulo">Entrou este mês</div>
    ${itensGanhoMes(k).map(i=>`
    <div class="linha-item">
      <div class="corpo"><div class="nome">${esc(i.g.desc)}</div>
      <div class="sub"><span class="tag rec">${esc(i.g.fonte)}</span>${i.g.repete?' · todo mês':''}</div></div>
      <div class="valor ent">${R$(i.valor)}</div>
    </div>`).join('')}`:''}

  <div class="secao-titulo">Próximas parcelas</div>
  ${proximas.length?proximas.map(x=>`
    <div class="linha-item">
      <div class="corpo"><div class="nome">${esc(x.desc)}</div>
      <div class="sub">${x.n}/${x.de} · ${x.dt.getDate()}/${String(x.dt.getMonth()+1).padStart(2,'0')} · ${FORMAS[x.forma]}</div></div>
      <div class="valor">${R$(x.valor)}</div>
    </div>`).join('')+`<button class="btn claro" onclick="UI.aba='gastos';UI.filtroGasto='parcelas';render()">Ver todas as parcelas</button>`
    :'<div class="vazio">Nenhuma parcela em aberto.</div>'}
  `;
}

function chipsGastos(){
  return `<div class="chips">${[['dia','Hoje'],['mes','Mês'],['ano','Ano'],['parcelas','Parcelas'],['fixas','Fixas']].map(a=>
    `<button class="chip" aria-pressed="${UI.filtroGasto===a[0]}" onclick="UI.filtroGasto='${a[0]}';UI.editandoF=null;render()">${a[1]}</button>`).join('')}</div>`;
}

function linhaItem(i,k){
  if(i.tipo==='fixa'){
    const pg=(D.fixasPagas||[]).indexOf(i.chave)>=0;
    const semValor=!(i.valor>0);
    return `<div class="linha-item fx" style="${pg?'opacity:.55':''}">
      <button class="marca ${pg?'on':''}" onclick="toggleFixaPaga('${i.chave}')" aria-label="Marcar paga"></button>
      <div class="corpo" onclick="editarFixa(${i.f.id})" style="cursor:pointer">
        <div class="nome">${esc(i.desc)}</div>
        <div class="sub">dia ${i.f.dia} · ${FORMAS[i.forma]} <span class="tag fixa">fixa</span>${(i.f.ajustes&&i.f.ajustes[k]!==undefined)?' <span class="tag">só este mês</span>':''}</div>
      </div>
      <div class="valor" style="${semValor?'color:var(--rosa);font-size:12px':''}">${semValor?'definir valor':R$(i.valor)}</div>
      <button class="lapis" onclick="editarFixa(${i.f.id})" aria-label="Editar">✎</button>
    </div>`;
  }
  const parc=i.tipo==='parcela';
  return `<div class="linha-item ${parc?'pc':''}">
    <div class="corpo" onclick="editarGasto(${i.id})" style="cursor:pointer">
      <div class="nome">${esc(i.desc)}</div>
      <div class="sub">${dataBR(i.data)} · ${FORMAS[i.forma]} ${parc?`<span class="tag parc">parcela ${i.n}/${i.de}</span>`:'<span class="tag">à vista</span>'} <span class="tag">${esc(i.cat)}</span></div>
    </div>
    <div class="valor">${R$(i.valor)}</div>
    <button class="lapis" onclick="editarGasto(${i.id})" aria-label="Editar">✎</button>
    <button class="x" onclick="apagarGasto(${i.id})" aria-label="Excluir">×</button>
  </div>`;
}

function cartaoResumo(itens,k){
  const total=itens.reduce((s,i)=>s+i.valor,0);
  const pf={}; itens.forEach(i=>pf[i.forma]=(pf[i.forma]||0)+i.valor);
  const soma=t=>itens.filter(i=>i.tipo===t).reduce((s,i)=>s+i.valor,0);
  return `<div class="cartao">
    <div class="topo">
      <div><span class="rot">Saiu ${k?'no mês':'no período'}</span><b class="val">${R$(total)}</b></div>
      <div style="text-align:right"><span class="rot">No cartão</span>
        <b class="val" style="font-size:17px;color:var(--rosa)">${R$(pf.credito||0)}</b></div>
    </div>
    <div class="barra">${Object.keys(FORMAS).map(f=>`<i style="width:${((pf[f]||0)/(total||1))*100}%;background:${COR_FORMA[f]}"></i>`).join('')}</div>
    <div class="legenda">${Object.keys(FORMAS).filter(f=>pf[f]).map(f=>`<div><em style="background:${COR_FORMA[f]}"></em>${FORMAS[f]} <b>${R$(pf[f])}</b></div>`).join('')}</div>
    <div class="reparte">
      <div><div class="rr">À vista</div><div class="vv">${R$(soma('vista'))}</div></div>
      <div><div class="rr">Parcelas</div><div class="vv">${R$(soma('parcela'))}</div></div>
      <div><div class="rr">Fixas</div><div class="vv">${R$(soma('fixa'))}</div></div>
    </div>
  </div>`;
}

function telaGastos(){
  const f=UI.filtroGasto;
  if(f==='parcelas') return chipsGastos()+listaParcelas()+formGasto();
  if(f==='fixas') return chipsGastos()+telaFixas();

  if(f==='ano'){
    const ano=+UI.mesRef.slice(0,4);
    const meses=mesesDoAno(ano);
    const todos=[]; meses.forEach(k=>itensDoMes(k).forEach(i=>todos.push(i)));
    const totalAno=todos.reduce((s,i)=>s+i.valor,0);
    return chipsGastos()
      + `<div class="navmes">
          <button onclick="mudarAnoGasto(-1)" aria-label="Ano anterior">‹</button>
          <span>${ano}</span>
          <button onclick="mudarAnoGasto(1)" aria-label="Próximo ano">›</button>
        </div>`
      + cartaoResumo(todos,false)
      + `<div class="secao-titulo">Mês a mês</div>`
      + meses.map((k,mi)=>{
          const v=fluxoMes(k);
          if(!v) return '';
          return `<div class="linha-item" onclick="UI.mesRef='${k}';UI.filtroGasto='mes';render()" style="cursor:pointer">
            <div class="corpo"><div class="nome">${MESES[mi]}</div>
            <div class="sub">${itensDoMes(k).length} lançamento(s)</div></div>
            <div class="valor">${R$(v)}</div>
          </div>`;
        }).join('')
      + (UI.editando===null?formGasto():'');
  }

  const k = f==='dia' ? chaveMes(agora()) : UI.mesRef;
  let itens = itensDoMes(k);
  if(f==='dia'){ const hj=hojeISO(); itens=itens.filter(i=>i.data===hj); }

  return chipsGastos()
    + (f==='mes'?navMes():'')
    + cartaoResumo(itens,f==='mes')
    + (UI.editando===null?formGasto():'')
    + `<div class="secao-titulo">${f==='dia'?'Hoje':'Tudo que cai em '+rotuloMes(k).split(' de ')[0]}</div>`
    + (itens.length
        ? itens.map(i=> (i.tipo!=='fixa' && UI.editando===i.id) ? formEdicao(D.gastos.find(g=>g.id===i.id)) : linhaItem(i,k)).join('')
        : '<div class="vazio">Nada neste período.</div>');
}

function mudarAnoGasto(n){
  const p=UI.mesRef.split('-');
  UI.mesRef=(+p[0]+n)+'-'+p[1]; render();
}
function toggleFixaPaga(c){
  const s=new Set(D.fixasPagas||[]);
  s.has(c)?s.delete(c):s.add(c);
  D.fixasPagas=Array.from(s); salvar(); render();
}

/* ---------- contas fixas ---------- */
function telaFixas(){
  const ativas=(D.fixas||[]).filter(f=>f.ativa!==false);
  const total=ativas.reduce((s,f)=>s+(f.valor||0),0);
  const semValor=ativas.filter(f=>!(f.valor>0)).length;
  const grupos={};
  (D.fixas||[]).forEach(f=>{ (grupos[f.forma]=grupos[f.forma]||[]).push(f); });

  return `<div class="cartao">
    <div class="topo">
      <div><span class="rot">Contas fixas por mês</span><b class="val">${R$(total)}</b></div>
      <div style="text-align:right"><span class="rot">Ativas</span>
        <b class="val" style="font-size:17px;color:var(--cinza)">${ativas.length}</b></div>
    </div>
    <div style="font-size:12.5px;color:var(--cinza)">Lançam sozinhas todo mês. O valor editado aqui vale para todos os meses; para mudar só um mês, abra a conta pela aba <b>Mês</b>.</div>
    ${semValor?`<div style="margin-top:11px;font-size:12.5px;color:var(--rosa)">${semValor} conta(s) ainda sem valor — toque para preencher.</div>`:''}
  </div>

  ${UI.editandoF===null?`<button class="btn ouro" onclick="novaFixa()" style="margin-bottom:14px">+ Nova conta fixa</button>`:''}

  ${Object.keys(grupos).map(fo=>`
    <div class="secao-titulo">${FORMAS[fo]||fo} · ${R$(grupos[fo].filter(f=>f.ativa!==false).reduce((s,f)=>s+(f.valor||0),0))}</div>
    ${grupos[fo].map(f=> UI.editandoF===f.id ? formFixa(f) : `
      <div class="linha-item fx" style="${f.ativa===false?'opacity:.45':''}">
        <div class="corpo" onclick="editarFixa(${f.id})" style="cursor:pointer">
          <div class="nome">${esc(f.nome)}</div>
          <div class="sub">dia ${f.dia} · ${esc(f.cat)}${f.ativa===false?' · pausada':''}</div>
        </div>
        <div class="valor" style="${!(f.valor>0)?'color:var(--rosa);font-size:12px':''}">${(f.valor>0)?R$(f.valor):'definir valor'}</div>
        <button class="lapis" onclick="editarFixa(${f.id})" aria-label="Editar">✎</button>
        <button class="x" onclick="apagarFixa(${f.id})" aria-label="Excluir">×</button>
      </div>`).join('')}
  `).join('')}`;
}

function formFixa(f){
  const aj=(f.ajustes&&f.ajustes[UI.mesRef]!==undefined)?f.ajustes[UI.mesRef]:'';
  return `<div class="form fixa-edit">
    <div class="edit-tit" style="color:#8A6212">${f.nome?'Editando conta fixa':'Nova conta fixa'}</div>
    <div class="campo"><label>Nome</label><input id="fNome" value="${esc(f.nome)}" placeholder="Ex.: Spotify"></div>
    <div class="dupla">
      <div class="campo"><label>Valor por mês</label><input id="fValor" type="number" inputmode="decimal" value="${f.valor||''}" placeholder="0,00"></div>
      <div class="campo"><label>Dia do vencimento</label><input id="fDia" type="number" min="1" max="31" value="${f.dia||10}"></div>
    </div>
    <div class="dupla">
      <div class="campo"><label>Pagamento</label><select id="fForma">
        ${Object.keys(FORMAS).map(o=>`<option value="${o}" ${o===f.forma?'selected':''}>${FORMAS[o]}</option>`).join('')}</select></div>
      <div class="campo"><label>Categoria</label><select id="fCat">
        ${D.catsGasto.map(c=>`<option ${c===f.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <div class="campo"><label>Situação</label><select id="fAtiva">
      <option value="1" ${f.ativa!==false?'selected':''}>Ativa — lança todo mês</option>
      <option value="0" ${f.ativa===false?'selected':''}>Pausada — não lança</option></select></div>
    <div class="campo"><label>Valor só para ${rotuloMes(UI.mesRef)}</label>
      <input id="fAjuste" type="number" inputmode="decimal" value="${aj}" placeholder="vazio = usa o valor normal"></div>
    <div class="dupla" style="margin-top:2px">
      <button class="btn claro" onclick="cancelarFixa(${f.id})">Cancelar</button>
      <button class="btn ouro" onclick="salvarFixa(${f.id})">Salvar</button>
    </div>
  </div>`;
}

function novaFixa(){
  const f={id:novoId(),nome:'',valor:0,forma:'pix',dia:10,cat:D.catsGasto[0],inicio:UI.mesRef,ativa:true,ajustes:{},nova:true};
  D.fixas.push(f); UI.editandoF=f.id; UI.filtroGasto='fixas'; render(); window.scrollTo(0,0);
}
function editarFixa(id){ UI.editandoF=id; UI.filtroGasto='fixas'; render(); window.scrollTo(0,0); }
function cancelarFixa(id){
  const f=D.fixas.find(x=>x.id===id);
  if(f&&f.nova) D.fixas=D.fixas.filter(x=>x.id!==id);
  UI.editandoF=null; render();
}
function salvarFixa(id){
  const f=D.fixas.find(x=>x.id===id);
  if(!f){ UI.editandoF=null; return render(); }
  const nome=document.getElementById('fNome').value.trim();
  const v=parseFloat(document.getElementById('fValor').value);
  if(!nome) return toast('Escreva o nome');
  if(!(v>=0)) return toast('Informe o valor');
  f.nome=nome; f.valor=v; delete f.nova;
  f.dia=Math.min(Math.max(1,+document.getElementById('fDia').value||1),31);
  f.forma=document.getElementById('fForma').value;
  f.cat=document.getElementById('fCat').value;
  f.ativa=document.getElementById('fAtiva').value==='1';
  const aj=document.getElementById('fAjuste').value.trim();
  f.ajustes=f.ajustes||{};
  if(aj==='') delete f.ajustes[UI.mesRef]; else f.ajustes[UI.mesRef]=parseFloat(aj);
  UI.editandoF=null; salvar(); render(); toast('Conta fixa salva');
}
function apagarFixa(id){
  const f=D.fixas.find(x=>x.id===id);
  if(!confirm('Excluir "'+f.nome+'"? Ela some de todos os meses.')) return;
  D.fixas=D.fixas.filter(x=>x.id!==id);
  D.fixasPagas=(D.fixasPagas||[]).filter(c=>c.split('-')[0]!=String(id));
  UI.editandoF=null; salvar(); render();
}

function navMes(){
  return `<div class="navmes">
    <button onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button>
    <span>${rotuloMes(UI.mesRef)}</span>
    <button onclick="mudarMes(1)" aria-label="Próximo mês">›</button>
  </div>`;
}
function mudarMes(n){
  const p=UI.mesRef.split('-'); const d=new Date(+p[0],+p[1]-1+n,1);
  UI.mesRef=chaveMes(d); render();
}

function camposGasto(g,p){
  const v=g||{desc:'',valor:'',data:hojeISO(),cat:D.catsGasto[0],forma:'credito',parcelado:false,parcelas:2};
  return `
    <div class="campo"><label>Descrição</label><input id="${p}Desc" value="${esc(v.desc)}" placeholder="No que gastou"></div>
    <div class="dupla">
      <div class="campo"><label>Valor total</label><input id="${p}Valor" type="number" inputmode="decimal" value="${v.valor}" placeholder="0,00"></div>
      <div class="campo"><label>Data</label><input id="${p}Data" type="date" value="${v.data}"></div>
    </div>
    <div class="dupla">
      <div class="campo"><label>Categoria</label>
        <select id="${p}Cat" onchange="trocarCat(this,'${p}')">
          ${D.catsGasto.map(c=>`<option ${c===v.cat?'selected':''}>${esc(c)}</option>`).join('')}
          ${(v.cat&&D.catsGasto.indexOf(v.cat)<0)?`<option selected>${esc(v.cat)}</option>`:''}
          <option value="__nova">+ Criar categoria...</option>
        </select></div>
      <div class="campo"><label>Pagamento</label><select id="${p}Forma">
        ${Object.keys(FORMAS).map(f=>`<option value="${f}" ${f===v.forma?'selected':''}>${FORMAS[f]}</option>`).join('')}</select></div>
    </div>
    <div class="campo" id="${p}CampoNova" style="display:none">
      <label>Nome da nova categoria</label>
      <input id="${p}CatNova" placeholder="Ex.: Pet, Farmácia, Presentes">
    </div>
    <div class="dupla">
      <div class="campo"><label>Forma</label><select id="${p}Parc" onchange="document.getElementById('${p}N').disabled=this.value==='vista'">
        <option value="vista" ${!v.parcelado?'selected':''}>À vista</option>
        <option value="parcelado" ${v.parcelado?'selected':''}>Parcelado</option></select></div>
      <div class="campo"><label>Nº de parcelas</label>
        <input id="${p}N" type="number" min="2" max="60" value="${v.parcelas||2}" ${!v.parcelado?'disabled':''}></div>
    </div>`;
}

function lerCamposGasto(p){
  const parc=document.getElementById(p+'Parc').value==='parcelado';
  let cat=document.getElementById(p+'Cat').value;
  if(cat==='__nova'){
    cat=document.getElementById(p+'CatNova').value.trim();
    if(!cat) return {erro:'Dê um nome à nova categoria'};
    const existe=D.catsGasto.find(c=>c.toLowerCase()===cat.toLowerCase());
    if(existe) cat=existe; else D.catsGasto.push(cat);
  }
  const d={
    desc:document.getElementById(p+'Desc').value.trim(),
    valor:parseFloat(document.getElementById(p+'Valor').value),
    data:document.getElementById(p+'Data').value,
    cat:cat,
    forma:document.getElementById(p+'Forma').value,
    parcelado:parc,
    parcelas:parc?Math.min(Math.max(2,+document.getElementById(p+'N').value||2),60):1
  };
  if(!d.desc) return {erro:'Escreva a descrição'};
  if(!(d.valor>0)) return {erro:'Informe um valor válido'};
  if(!d.data) return {erro:'Escolha a data'};
  return d;
}

function formGasto(){
  return `<div class="form">
    ${camposGasto(null,'g')}
    <button class="btn" onclick="addGasto()">Lançar gasto</button>
  </div>
  <details class="cat" style="margin-bottom:14px">
    <summary>
      <span class="seta">›</span>
      <span class="cnome">Categorias</span>
      <span class="tag">${D.catsGasto.length}</span>
    </summary>
    <div class="cot">
      <div class="cats-chips">
        ${D.catsGasto.map((c,i)=>`
          <span class="cat-chip">${esc(c)}
            <button onclick="apagarCatGasto(${i})" aria-label="Excluir ${esc(c)}">×</button>
          </span>`).join('')}
      </div>
      <div class="campo" style="margin:14px 0 0">
        <label>Nova categoria</label>
        <input id="novaCatGasto" placeholder="Ex.: Pet, Farmácia, Presentes">
      </div>
      <button class="btn claro" onclick="addCatGasto()">Criar categoria</button>
    </div>
  </details>`;
}

function formEdicao(g){
  return `<div class="form edicao">
    <div class="edit-tit">Editando lançamento</div>

  </div>`;
}
function trocarCat(sel,p){

function listaParcelas(){
  const ps=todasParcelas(), pagas=pagasSet(), grupos={};
  ps.forEach(p=>{ const k=chaveMes(p.dt); (grupos[k]=grupos[k]||[]).push(p); });
  const chaves=Object.keys(grupos).sort();
  const aberto=ps.filter(p=>!pagas.has(p.chave)).reduce((s,p)=>s+p.valor,0);
  return `
  <div class="cartao">
    <div class="topo"><div><span class="rot">Em aberto</span><b class="val">${R$(aberto)}</b></div>
    <div style="text-align:right"><span class="rot">Parcelas</span><b class="val" style="font-size:17px;color:var(--cinza)">${ps.filter(p=>!pagas.has(p.chave)).length}</b></div></div>
    <div style="font-size:12.5px;color:var(--cinza)">Cada compra parcelada cai automaticamente nos meses seguintes. Toque no círculo para marcar como paga.</div>
  </div>
  ${chaves.length?chaves.map(k=>{
    const soma=grupos[k].reduce((s,p)=>s+p.valor,0);
    return `<div class="mes">${rotuloMes(k)}<span>${R$(soma)}</span></div>`+
      grupos[k].map(p=>{const pg=pagas.has(p.chave); return `
      <div class="linha-item" style="${pg?'opacity:.55':''}">
        <button class="marca ${pg?'on':''}" onclick="togglePaga('${p.chave}')" aria-label="Marcar paga"></button>
        <div class="corpo"><div class="nome">${esc(p.desc)}</div><div class="sub">parcela ${p.n} de ${p.de} · ${FORMAS[p.forma]}</div></div>
        <div class="valor">${R$(p.valor)}</div>
      </div>`;}).join('');
  }).join(''):'<div class="vazio">Nenhuma compra parcelada lançada.</div>'}`;
}

function telaGrafico(){
  if(!D.gastos.length && !(D.ganhos||[]).length)
    return '<div class="vazio" style="padding:40px 20px">Os gráficos aparecem assim que houver lançamentos.</div>';
  return `<div class="chips">
    <button class="chip" aria-pressed="${UI.vistaGraf==='mes'}" onclick="UI.vistaGraf='mes';render()">Por mês</button>
    <button class="chip" aria-pressed="${UI.vistaGraf==='ano'}" onclick="UI.vistaGraf='ano';render()">Por ano</button>
  </div>` + (UI.vistaGraf==='ano'?grafAno():grafMes());
}

function grafMes(){
  const base=agora(); const chaves=[];
  for(let i=5;i>=0;i--){ const d=new Date(base.getFullYear(),base.getMonth()-i,1); chaves.push({k:chaveMes(d),r:M3[d.getMonth()]}); }
  const ents=chaves.map(c=>entradasMes(c.k)), sais=chaves.map(c=>fluxoMes(c.k));
  const maxV=Math.max.apply(null,ents.concat(sais).concat([1]));
  const W=340,bw=13,esp=4,grupo=bw*2+esp,gap=(W-6*grupo)/7;
  const atualK=chaveMes(base);
  const barras=chaves.map((c,i)=>{
    const x=gap+i*(grupo+gap), at=c.k===atualK;
    const he=Math.max((ents[i]/maxV)*100,2), hs=Math.max((sais[i]/maxV)*100,2);
    return `<rect x="${x}" y="${118-he}" width="${bw}" height="${he}" rx="3" fill="#2E7D52"></rect>
      <rect x="${x+bw+esp}" y="${118-hs}" width="${bw}" height="${hs}" rx="3" fill="#B4566A"></rect>
      <text x="${x+grupo/2}" y="134" text-anchor="middle" font-size="10.5" font-family="Inter" font-weight="${at?600:400}" fill="${at?'#12322A':'#6E7C74'}">${c.r}</text>`;
  }).join('');

  const itens=itensDoMes(atualK);
  const tot=itens.reduce((s,i)=>s+i.valor,0)||1;
  const porForma={}; itens.forEach(i=>porForma[i.forma]=(porForma[i.forma]||0)+i.valor);
  const C=2*Math.PI*44; let off=0;
  const aneis=Object.keys(FORMAS).map(f=>{
    const len=((porForma[f]||0)/tot)*C;
    const el=`<circle cx="60" cy="60" r="44" fill="none" stroke="${COR_FORMA[f]}" stroke-width="15" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"></circle>`;
    off+=len; return el;
  }).join('');

  const porCat={}; itens.forEach(i=>porCat[i.cat]=(porCat[i.cat]||0)+i.valor);
  const ord=Object.keys(porCat).map(c=>[c,porCat[c]]).sort((a,b)=>b[1]-a[1]);
  const maxC=ord.length?ord[0][1]:1;

  const porFonte={}; itensGanhoMes(atualK).forEach(i=>porFonte[i.fonte]=(porFonte[i.fonte]||0)+i.valor);
  const ordF=Object.keys(porFonte).map(c=>[c,porFonte[c]]).sort((a,b)=>b[1]-a[1]);
  const maxF=ordF.length?ordF[0][1]:1;
  const entA=entradasMes(atualK), saiA=fluxoMes(atualK);

  return `
  <div class="secao-titulo">Entrou × saiu — últimos 6 meses</div>
  <div class="cartao">
    <svg viewBox="0 0 ${W} 145" width="100%" role="img" aria-label="Entradas e saídas dos últimos seis meses">${barras}</svg>
    <div class="fluxo" style="border-top:1px solid var(--linha);padding-top:11px">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou este mês</div><div class="vl">${R$(entA)}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(saiA)}</div></div>
    </div>
  </div>

  ${ordF.length?`<div class="secao-titulo">De onde veio o dinheiro</div>
  <div class="cartao">
    ${ordF.map(a=>`<div class="hbar"><div class="l"><span>${esc(a[0])}</span><b>${R$(a[1])}</b></div>
      <div class="t"><i style="width:${(a[1]/maxF)*100}%;background:var(--verde)"></i></div></div>`).join('')}
  </div>`:''}

  <div class="secao-titulo">Como você pagou este mês</div>
  <div class="cartao" style="display:flex;gap:14px;align-items:center">
    <svg viewBox="0 0 120 120" width="118" height="118" style="flex:none">${aneis}
      <text x="60" y="56" text-anchor="middle" font-size="9" font-family="Inter" fill="#6E7C74" letter-spacing="1">TOTAL</text>
      <text x="60" y="72" text-anchor="middle" font-size="14" font-family="Fraunces" fill="#12322A">${curto(tot===1?0:tot)}</text>
    </svg>
    <div style="flex:1">
      ${Object.keys(FORMAS).map(f=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px">
        <span style="color:var(--cinza)"><em style="display:inline-block;width:8px;height:8px;border-radius:99px;background:${COR_FORMA[f]};margin-right:6px"></em>${FORMAS[f]}</span>
        <b style="font-variant-numeric:tabular-nums">${(((porForma[f]||0)/tot)*100).toFixed(0)}%</b></div>`).join('')}
    </div>
  </div>

  <div class="secao-titulo">Onde o dinheiro foi</div>
  <div class="cartao">
    ${ord.length?ord.map(a=>`<div class="hbar"><div class="l"><span>${esc(a[0])}</span><b>${R$(a[1])}</b></div>
      <div class="t"><i style="width:${(a[1]/maxC)*100}%;background:var(--tinta2)"></i></div></div>`).join('')
      :'<div class="vazio" style="margin:0">Sem gastos neste mês.</div>'}
  </div>`;
}


function grafAno(){
  const a=UI.anoRef, meses=mesesDoAno(a);
  const ents=meses.map(entradasMes), sais=meses.map(fluxoMes);
  const totE=ents.reduce((s,v)=>s+v,0), totS=sais.reduce((s,v)=>s+v,0), saldo=totE-totS;
  const maxV=Math.max.apply(null,ents.concat(sais).concat([1]));
  const W=340,bw=9,esp=3,grupo=bw*2+esp,gap=(W-12*grupo)/13;
  const barras=meses.map((k,i)=>{
    const x=gap+i*(grupo+gap);
    const he=Math.max((ents[i]/maxV)*98,1.5), hs=Math.max((sais[i]/maxV)*98,1.5);
    return `<rect x="${x}" y="${112-he}" width="${bw}" height="${he}" rx="2.5" fill="#2E7D52"></rect>
      <rect x="${x+bw+esp}" y="${112-hs}" width="${bw}" height="${hs}" rx="2.5" fill="#B4566A"></rect>
      <text x="${x+grupo/2}" y="128" text-anchor="middle" font-size="8.5" font-family="Inter" fill="#6E7C74">${M3[i][0].toUpperCase()}</text>`;
  }).join('');

  const cg=agregaAno(a,itensDoMes,'cat'), cr=agregaAno(a,itensGanhoMes,'fonte');
  const ordG=Object.keys(cg.tot).map(c=>[c,cg.tot[c]]).sort((x,y)=>y[1]-x[1]);
  const ordR=Object.keys(cr.tot).map(c=>[c,cr.tot[c]]).sort((x,y)=>y[1]-x[1]);
  const maxG=ordG.length?ordG[0][1]:1, maxR=ordR.length?ordR[0][1]:1;

  const bloco=(ord,dados,max,total,cor)=>ord.map(x=>`
    <details class="catbox">
      <summary>
        <div class="catlin"><span class="nm"><span class="sta">›</span>${esc(x[0])}</span>
        <b>${R$(x[1])}<span class="pc">${total?((x[1]/total)*100).toFixed(0):0}%</span></b></div>
        <div class="hbar" style="margin:0"><div class="t"><i style="width:${(x[1]/max)*100}%;background:${cor}"></i></div></div>
      </summary>
      <div class="mensal">${dados.mensal[x[0]].map((mv,mi)=>mv>0?`
        <div class="mlin"><span class="mn">${M3[mi]}</span>
        <span class="mt"><i style="width:${(mv/Math.max.apply(null,dados.mensal[x[0]]))*100}%;background:${cor}"></i></span>
        <span class="mv">${R$(mv)}</span></div>`:'').join('')}</div>
    </details>`).join('');

  const rodape=t=>`<div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--linha);font-weight:600;margin-top:4px">
    <span>Total</span><span style="font-family:var(--display);font-variant-numeric:tabular-nums">${R$(t)}</span></div>`;

  return `
  <div class="navmes">
    <button onclick="UI.anoRef--;render()" aria-label="Ano anterior">‹</button>
    <span>${a}</span>
    <button onclick="UI.anoRef++;render()" aria-label="Próximo ano">›</button>
  </div>
  <div class="saldo">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><span class="rot">${saldo>=0?'Sobrou em':'Faltou em'} ${a}</span>
        <b class="val" style="color:${saldo>=0?'var(--verde)':'var(--rosa)'}">${R$(Math.abs(saldo))}</b></div>
      ${totE?`<div style="text-align:right"><span class="rot">do que entrou</span>
        <b class="val" style="font-size:17px;color:var(--cinza)">${((saldo/totE)*100).toFixed(0)}%</b></div>`:''}
    </div>
    <svg viewBox="0 0 ${W} 138" width="100%" style="margin-top:10px" role="img" aria-label="Entradas e saídas mês a mês">${barras}</svg>
    <div class="fluxo" style="border-top:1px solid var(--linha);padding-top:11px">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou no ano</div><div class="vl">${R$(totE)}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(totS)}</div></div>
    </div>
  </div>

  <div class="secao-titulo">Recebimentos por fonte no ano</div>
  <div class="cartao">${ordR.length?bloco(ordR,cr,maxR,totE,'var(--verde)')+rodape(totE)
    :'<div class="vazio" style="margin:0">Sem recebimentos neste ano.</div>'}</div>

  <div class="secao-titulo">Gastos por categoria no ano</div>
  <div class="cartao">${ordG.length?bloco(ordG,cg,maxG,totS,'var(--rosa)')+rodape(totS)
    :'<div class="vazio" style="margin:0">Sem gastos neste ano.</div>'}</div>`;
}

/* ==================== RECEBIMENTOS ==================== */
function telaGanhos(){
  const f=UI.filtroGanho, hj=hojeISO(), ano=UI.mesRef.slice(0,4);
  let lista, total, rotulo;
  if(f==='mes'){
    lista=itensGanhoMes(UI.mesRef).map(i=>i.g);
    total=entradasMes(UI.mesRef); rotulo='no mês';
  } else if(f==='ano'){
    const vistos={}; lista=[];
    mesesDoAno(+ano).forEach(k=>itensGanhoMes(k).forEach(i=>{ if(!vistos[i.g.id]){vistos[i.g.id]=1;lista.push(i.g);} }));
    total=mesesDoAno(+ano).reduce((s,k)=>s+entradasMes(k),0); rotulo='no ano';
  } else {
    lista=(D.ganhos||[]).filter(g=>g.data===hj);
    total=lista.reduce((s,g)=>s+g.valor,0); rotulo='hoje';
  }
  lista=lista.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  return `<div class="chips">
    ${[['dia','Hoje'],['mes','Mês'],['ano','Ano']].map(a=>
      `<button class="chip verde" aria-pressed="${f===a[0]}" onclick="UI.filtroGanho='${a[0]}';render()">${a[1]}</button>`).join('')}
  </div>`
  + (f==='mes'?navMes():'')
  + `<div class="cartao">
    <div class="topo">
      <div><span class="rot">Total recebido ${rotulo}</span><b class="val" style="color:var(--verde)">${R$(total)}</b></div>
      <div style="text-align:right"><span class="rot">Itens</span><b class="val" style="font-size:17px;color:var(--cinza)">${lista.length}</b></div>
    </div>
    <div style="font-size:12px;color:var(--cinza)">Recebimentos marcados como <b>todo mês</b> aparecem sozinhos nos meses seguintes.</div>
  </div>`
  + (UI.editandoG===null?formGanho():'')
  + `<div class="secao-titulo">Recebimentos</div>`
  + (lista.length?lista.map(g=> UI.editandoG===g.id ? formEdicaoGanho(g) : `
    <div class="linha-item">
      <div class="corpo" onclick="editarGanho(${g.id})" style="cursor:pointer">
        <div class="nome">${esc(g.desc)}</div>
        <div class="sub">${dataBR(g.data)} · ${ONDE[g.onde]||'Conta'}${g.repete?' · repete '+(g.vezes||12)+'x':''} <span class="tag rec">${esc(g.fonte)}</span></div>
      </div>
      <div class="valor ent">${R$(g.valor)}</div>
      <button class="lapis" onclick="editarGanho(${g.id})" aria-label="Editar">✎</button>
      <button class="x" onclick="apagarGanho(${g.id})" aria-label="Excluir">×</button>
    </div>`).join('')
    :'<div class="vazio">Nenhum recebimento neste período.</div>');
}

function camposGanho(g,p){
  const v=g||{desc:'',valor:'',data:hojeISO(),fonte:D.fontes[0],onde:'conta',repete:false,vezes:12};
  return `
    <div class="campo"><label>Descrição</label><input id="${p}Desc" value="${esc(v.desc)}" placeholder="Ex.: Salário, honorários do cliente X"></div>
    <div class="dupla">
      <div class="campo"><label>Valor</label><input id="${p}Valor" type="number" inputmode="decimal" value="${v.valor}" placeholder="0,00"></div>
      <div class="campo"><label>Data</label><input id="${p}Data" type="date" value="${v.data}"></div>
    </div>
    <div class="dupla">
      <div class="campo"><label>Fonte</label>
        <select id="${p}Fonte" onchange="trocarFonte(this,'${p}')">
          ${D.fontes.map(f=>`<option ${f===v.fonte?'selected':''}>${esc(f)}</option>`).join('')}
          ${(v.fonte&&D.fontes.indexOf(v.fonte)<0)?`<option selected>${esc(v.fonte)}</option>`:''}
          <option value="__nova">+ Criar fonte...</option>
        </select></div>
      <div class="campo"><label>Recebido em</label><select id="${p}Onde">
        ${Object.keys(ONDE).map(o=>`<option value="${o}" ${o===v.onde?'selected':''}>${ONDE[o]}</option>`).join('')}</select></div>
    </div>
    <div class="campo" id="${p}CampoNovaF" style="display:none">
      <label>Nome da nova fonte</label>
      <input id="${p}FonteNova" placeholder="Ex.: Aluguel, Comissão">
    </div>
    <div class="dupla">
      <div class="campo"><label>Frequência</label><select id="${p}Rep" onchange="document.getElementById('${p}Vezes').disabled=this.value==='unico'">
        <option value="unico" ${!v.repete?'selected':''}>Uma vez</option>
        <option value="mensal" ${v.repete?'selected':''}>Todo mês</option></select></div>
      <div class="campo"><label>Por quantos meses</label>
        <input id="${p}Vezes" type="number" min="2" max="60" value="${v.vezes||12}" ${!v.repete?'disabled':''}></div>
    </div>`;
}

function trocarFonte(sel,p){
  const campo=document.getElementById(p+'CampoNovaF');
  const nova=sel.value==='__nova';
  campo.style.display=nova?'block':'none';
  if(nova) document.getElementById(p+'FonteNova').focus();
}

function lerGanho(p){
  const rep=document.getElementById(p+'Rep').value==='mensal';
  let fonte=document.getElementById(p+'Fonte').value;
  if(fonte==='__nova'){
    fonte=document.getElementById(p+'FonteNova').value.trim();
    if(!fonte) return {erro:'Dê um nome à nova fonte'};
    const existe=D.fontes.find(f=>f.toLowerCase()===fonte.toLowerCase());
    if(existe) fonte=existe; else D.fontes.push(fonte);
  }
  const d={
    desc:document.getElementById(p+'Desc').value.trim(),
    valor:parseFloat(document.getElementById(p+'Valor').value),
    data:document.getElementById(p+'Data').value,
    fonte:fonte,
    onde:document.getElementById(p+'Onde').value,
    repete:rep,
    vezes:rep?Math.min(Math.max(2,+document.getElementById(p+'Vezes').value||12),60):1
  };
  if(!d.desc) return {erro:'Escreva a descrição'};
  if(!(d.valor>0)) return {erro:'Informe um valor válido'};
  if(!d.data) return {erro:'Escolha a data'};
  return d;
}

function formGanho(){
  return `<div class="form entrada">
    ${camposGanho(null,'r')}
    <button class="btn verde" onclick="addGanho()">Lançar recebimento</button>
  </div>
  <details class="cat" style="margin-bottom:14px">
    <summary><span class="seta">›</span><span class="cnome">Fontes</span><span class="tag">${D.fontes.length}</span></summary>
    <div class="cot">
      <div class="cats-chips">
        ${D.fontes.map((f,i)=>`<span class="cat-chip">${esc(f)}
          <button onclick="apagarFonte(${i})" aria-label="Excluir ${esc(f)}">×</button></span>`).join('')}
      </div>
      <div class="campo" style="margin:14px 0 0"><label>Nova fonte</label>
        <input id="novaFonte" placeholder="Ex.: Aluguel, Comissão"></div>
      <button class="btn claro" onclick="addFonte()">Criar fonte</button>
    </div>
  </details>`;
}

function formEdicaoGanho(g){
  return `<div class="form entrada edicao-g">
    <div class="edit-tit" style="color:var(--verde)">Editando recebimento</div>
    ${camposGanho(g,'q')}
    <div class="dupla" style="margin-top:2px">
      <button class="btn claro" onclick="UI.editandoG=null;render()">Cancelar</button>
      <button class="btn verde" onclick="salvarGanho(${g.id})">Salvar</button>
    </div>
  </div>`;
}

function addGanho(){
  const d=lerGanho('r');
  if(d.erro) return toast(d.erro);
  D.ganhos.push(Object.assign({id:novoId()},d));
  salvar(); render(); toast('Recebimento lançado');
}
function editarGanho(id){ UI.editandoG=id; render(); }
function salvarGanho(id){
  const d=lerGanho('q');
  if(d.erro) return toast(d.erro);
  const g=D.ganhos.find(x=>x.id===id);
  if(!g){ UI.editandoG=null; return render(); }
  Object.assign(g,d);
  UI.editandoG=null; salvar(); render(); toast('Recebimento atualizado');
}
function apagarGanho(id){
  if(!confirm('Excluir este recebimento?')) return;
  D.ganhos=D.ganhos.filter(g=>g.id!==id); salvar(); render();
}
function addFonte(){
  const n=document.getElementById('novaFonte').value.trim();
  if(!n) return toast('Dê um nome à fonte');
  if(D.fontes.some(f=>f.toLowerCase()===n.toLowerCase())) return toast('Essa fonte já existe');
  D.fontes.push(n); salvar(); render(); toast('Fonte criada');
}
function apagarFonte(i){
  const nome=D.fontes[i];
  if(nome===undefined) return;
  if(D.fontes.length<=1) return toast('Deixe ao menos uma fonte');
  const usos=(D.ganhos||[]).filter(g=>g.fonte===nome).length;
  const aviso=usos
    ? 'A fonte "'+nome+'" tem '+usos+' recebimento(s). Eles continuam com esse nome, mas ela sai da lista. Continuar?'
    : 'Excluir a fonte "'+nome+'"?';
  if(!confirm(aviso)) return;
  D.fontes.splice(i,1); salvar(); render();
}

    + (UI.subCas==='convidados'?subConvidados():UI.subCas==='cotacoes'?subCotacoes():subTotal());
}

const TIT_CONV={confirmado:'Confirmados',pendente:'Pendentes',recusou:'Não vão',espera:'Lista de espera',criancas:'Crianças'};
const ROT_CONV={pendente:'pendente',confirmado:'confirmado',recusou:'não vai',espera:'espera'};
const semAcento = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const IC_CHECK='<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
const IC_XIS='<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>';
const IC_AMP='<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8M6 17h8M7 3c0 3.5 3 4.6 3 7s-3 3.5-3 7M13 3c0 3.5-3 4.6-3 7s3 3.5 3 7"/></svg>';
const IC_LIXO='<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h13M8 5.5V4h4v1.5M5.5 5.5l.8 10a1 1 0 001 .9h5.4a1 1 0 001-.9l.8-10M8.5 8.5v5M11.5 8.5v5"/></svg>';

    <div class="edit-tit" style="color:var(--vinho)">Editando convidado</div>
    <div class="campo"><label>Nome</label><input id="eNome" value="${esc(c.nome)}"></div>
    <div class="dupla">
      <div class="campo"><label>Grupo</label><input id="eGrupo" value="${esc(c.grupo)}" list="gEdit">
        <datalist id="gEdit">${gr.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
      <div class="campo"><label>Lado</label><select id="eLado">
        <option value="noiva" ${c.lado==='noiva'?'selected':''}>Noiva</option>
        <option value="noivo" ${c.lado==='noivo'?'selected':''}>Noivo</option>
        <option value="ambos" ${c.lado==='ambos'?'selected':''}>Os dois</option></select></div>
    </div>
    <div class="dupla">
      <div class="campo"><label>É criança?</label><select id="eKid">
        <option value="0" ${!c.crianca?'selected':''}>Não</option>
        <option value="1" ${c.crianca?'selected':''}>Sim</option></select></div>

    </div>

      <button class="btn claro" onclick="UI.editandoConv=null;render()">Cancelar</button>
      <button class="btn rosa" onclick="salvarConv(${c.id})">Salvar</button>
    </div>
  </div>`;
}
function editarConv(id){ UI.editandoConv=id; render(); }
function salvarConv(id){
  const n=document.getElementById('eNome').value.trim();
  if(!n) return toast('Escreva o nome');
  const c=D.convidados.find(x=>x.id===id);
  if(!c){ UI.editandoConv=null; return render(); }
  c.nome=n;
  c.grupo=document.getElementById('eGrupo').value.trim()||'Outros';
  c.lado=document.getElementById('eLado').value;
  c.crianca=document.getElementById('eKid').value==='1';
  c.acomp=Math.min(Math.max(0,+document.getElementById('eAcomp').value||0),20);
  UI.editandoConv=null; salvar(); render(); toast('Convidado atualizado');
}
function linhaConv(c){
  if(UI.editandoConv===c.id) return formEditConv(c);
  const e=c.status==='espera';
  const b=(st,tit,svg)=>`<button class="st ${st} ${c.status===st?'on':''}" title="${tit}" aria-label="${tit}" onclick="setStatusConv(${c.id},'${st}')">${svg}</button>`;
  return `<div class="linha-item ${e?'espera':''} ${c.status==='recusou'?'recusou':''}">
    <div class="corpo">
      <div class="nome" onclick="editarConv(${c.id})" style="cursor:pointer">${c.crianca?'<span class="kid">criança</span> ':''}${esc(c.nome)}${c.acomp?` <span style="color:var(--cinza);font-weight:400">+${c.acomp}</span>`:''} <span class="edt">✎</span></div>
      <div class="sub">
        <span class="tag ${c.lado}">${c.lado==='ambos'?'os dois':c.lado}</span>
        <span class="tag ${c.status==='confirmado'?'ok':e?'esp':''}">${ROT_CONV[c.status]||c.status}</span>
      </div>
    </div>
    <div class="acoes">
      ${b('confirmado','Confirmado',IC_CHECK)}
      ${b('recusou','Não vai',IC_XIS)}
      ${b('espera','Lista de espera',IC_AMP)}
      <span class="sep"></span>
      <button class="st del" title="Excluir" aria-label="Excluir" onclick="apagarConv(${c.id})">${IC_LIXO}</button>
    </div>
  </div>`;
}

function subConvidados(){
  const t=totaisCasamento();
  const f=UI.filtroConv, q=semAcento(UI.buscaConv.trim());
  const bate=c=>!q||semAcento(c.nome).indexOf(q)>=0||semAcento(c.grupo).indexOf(q)>=0;
  const vis=D.convidados.filter(c=>{
    if(!bate(c)) return false;
    if(f==='todos') return c.status!=='espera';
    if(f==='espera') return c.status==='espera';
    if(f==='criancas') return c.crianca && c.status!=='recusou' && c.status!=='espera';
    return c.status===f;
  });
  const grupos=[]; vis.forEach(c=>{ if(grupos.indexOf(c.grupo)<0) grupos.push(c.grupo); });
  const todosGrupos=[]; D.convidados.forEach(c=>{ if(todosGrupos.indexOf(c.grupo)<0) todosGrupos.push(c.grupo); });

  return `
  <div class="grade4">
    <button class="mini ${f==='todos'?'sel':''}" onclick="UI.filtroConv='todos';render()">
      <div class="num">${t.pessoas}</div><div class="pe">na lista</div></button>
    <button class="mini v ${f==='confirmado'?'sel':''}" onclick="UI.filtroConv='confirmado';render()">
      <div class="num" style="color:var(--verde)">${t.confirmadas}</div><div class="pe">confirmadas</div></button>
    <button class="mini o ${f==='criancas'?'sel':''}" onclick="UI.filtroConv='criancas';render()">
      <div class="num" style="color:#8A6212">${t.criancas}</div><div class="pe">crianças</div></button>
    <button class="mini esp ${f==='espera'?'sel':''}" onclick="UI.filtroConv='espera';render()">
      <div class="num" style="color:#3B5C8A">${t.espera}</div><div class="pe">na espera</div></button>
  </div>

  <div class="busca"><span class="lupa">⌕</span>
    <input id="qConv" value="${esc(UI.buscaConv)}" placeholder="Buscar por nome ou grupo" oninput="buscarConv(this)"></div>

  <div class="chips">
    ${[['pendente','Pendentes ('+t.pendentes+')'],['recusou','Não vão ('+t.recusaram+')']].map(a=>
      `<button class="chip" aria-pressed="${f===a[0]}" onclick="UI.filtroConv='${a[0]}';render()">${a[1]}</button>`).join('')}
    ${(f!=='todos'||UI.buscaConv)?`<button class="chip lim" onclick="UI.filtroConv='todos';UI.buscaConv='';render()">limpar filtro ×</button>`:''}
  </div>

  <details class="cat" style="margin-bottom:14px">
    <summary><span class="seta">›</span><span class="cnome">Adicionar convidado</span></summary>
    <div class="cot">
      <div class="campo"><label>Nome</label><input id="cNome" placeholder="Quem vocês querem convidar"></div>
      <div class="dupla">
        <div class="campo"><label>Lado</label><select id="cLado">
          <option value="noiva">Noiva</option><option value="noivo">Noivo</option><option value="ambos">Os dois</option></select></div>
        <div class="campo"><label>É criança?</label><select id="cKid">
          <option value="0">Não</option><option value="1">Sim</option></select></div>
      </div>
      <div class="dupla">
        <div class="campo"><label>Grupo</label><input id="cGrupo" list="grp" placeholder="Família">
          <datalist id="grp">${todosGrupos.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
        <div class="campo"><label>Situação</label><select id="cStatus">
          <option value="pendente">Pendente</option><option value="confirmado">Confirmado</option>
          <option value="recusou">Não vai</option><option value="espera">Lista de espera</option></select></div>
      </div>
      <button class="btn rosa" onclick="addConv()">Adicionar</button>
    </div>
  </details>

  ${f==='todos'
    ? (grupos.length?grupos.map(g=>{
        const lista=vis.filter(c=>c.grupo===g);
        return `<details class="cat" ${q?'open':''}>
          <summary><span class="seta">›</span><span class="cnome">${esc(g)}</span><span class="tag">${lista.length}</span></summary>
          <div style="padding:0 10px 10px">${lista.map(linhaConv).join('')}</div></details>`;
      }).join('')
      :'<div class="vazio">A lista de convidados está vazia.</div>')
    : `<div class="secao-titulo">${TIT_CONV[f]} · ${vis.length}</div>`
      + (vis.length?vis.map(linhaConv).join('')
        : `<div class="vazio">${f==='espera'
          ?'A lista de espera está vazia.<br><span style="font-size:12px">Para incluir alguém, toque na ampulheta ao lado do nome.</span>'
          :'Ninguém nesta lista ainda.'}</div>`)}
  `;
}

function buscarConv(el){
  UI.buscaConv=el.value;
  const p=el.selectionStart;
  render();
  const novo=document.getElementById('qConv');
  if(novo){ novo.focus(); novo.setSelectionRange(p,p); }
}
function setStatusConv(id,st){
  const c=D.convidados.find(x=>x.id===id);
  if(!c) return;
  c.status=(c.status===st)?'pendente':st;
  salvar(); render();
  toast(c.status==='pendente'?c.nome+': pendente'
    :c.status==='confirmado'?c.nome+' confirmado'
    :c.status==='recusou'?c.nome+' não vai'
    :c.nome+' foi para a espera');
}

function subCotacoes(){
  const t=totaisCasamento();
  const decididas=D.categorias.filter(c=>c.cotacoes.some(q=>q.escolhida));
  const pendentes=D.categorias.filter(c=>!c.cotacoes.some(q=>q.escolhida));
  const f=UI.filtroCot;
  const visiveis = f==='escolhidas'?decididas : f==='decidir'?pendentes : D.categorias;

  return `
  <div class="cartao">
    <div class="topo">
      <div><span class="rot">Já escolhido</span><b class="val">${R$(t.contratado)}</b></div>
      <div style="text-align:right"><span class="rot">Decisões</span>
        <b class="val" style="font-size:17px;color:var(--cinza)">${decididas.length}/${D.categorias.length}</b></div>
    </div>
    <div class="barra"><i style="width:${(decididas.length/(D.categorias.length||1))*100}%;background:var(--ouro)"></i></div>

  <div class="chips" style="margin-top:13px">
    ${[['todas','Todas'],['escolhidas','Escolhidas ('+decididas.length+')'],['decidir','A decidir ('+pendentes.length+')']].map(a=>

        </span>
        ${e?`<span class="cval">${R$(e.valor)}</span>`:''}
        <button class="x" onclick="event.preventDefault();event.stopPropagation();apagarCat(${c.id})" aria-label="Excluir categoria" style="font-size:15px">×</button>
      </summary>
      ${c.cotacoes.map(q=>`
        <div class="cot ${q.escolhida?'escolhida':''}">
          <div class="cot-topo">
            <div style="min-width:0">
              <div style="font-weight:600">${esc(q.fornecedor)}</div>
              <div style="font-size:12px;color:var(--cinza);margin-top:2px">${q.obs?esc(q.obs):'sem observação'}</div>
            </div>
            <div style="font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap">${R$(q.valor)}</div>
          </div>
          <div class="cot-acoes">
            <button class="escolher ${q.escolhida?'on':''}" onclick="escolher(${c.id},${q.id})">${q.escolhida?'✓ Escolhido':'Escolher'}</button>
            ${q.escolhida?'<span style="font-size:11.5px;color:#8A6212">entra no total do casamento</span>':''}
            <button class="apagar" onclick="apagarCot(${c.id},${q.id})">Excluir</button>

      <div class="cot">
        <div class="dupla">
          <div class="campo"><label>Fornecedor</label><input id="f${c.id}" placeholder="Nome"></div>
          <div class="campo"><label>Valor</label><input id="v${c.id}" type="number" inputmode="decimal" placeholder="0,00"></div>

  <div class="secao-titulo">Resumo das decisões</div>
  ${decididas.length?`<div class="cartao">

      const outras=c.cotacoes.filter(q=>!q.escolhida);
      const min=outras.length?Math.min.apply(null,outras.map(q=>q.valor)):null;

  ${pendentes.length?`<div class="cartao" style="font-size:12.5px;color:var(--cinza)">
    <b style="color:var(--tinta)">Ainda a decidir:</b> ${pendentes.map(c=>esc(c.nome)).join(' · ')}</div>`:''}

  <div class="form">
