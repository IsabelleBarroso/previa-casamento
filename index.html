}

function subTotal(){
  const t=totaisCasamento();
  const larg=Math.max(D.orcamento,t.contratado)||1;
  const escolhidas=D.categorias.map(c=>({c,e:c.cotacoes.find(q=>q.escolhida)})).filter(x=>x.e);
  const faltaFechar=D.categorias.filter(c=>!c.cotacoes.some(q=>q.escolhida));

  return `
  <div class="cartao">
    <div class="topo">
      <div><span class="rot">Total contratado</span><b class="val">${R$(t.contratado)}</b></div>
      <div style="text-align:right"><span class="rot">Teto</span><b class="val" style="font-size:17px;color:var(--cinza)">${R$(D.orcamento)}</b></div>
    </div>
    <div class="barra">
      <i style="width:${(t.pago/larg)*100}%;background:var(--ouro)"></i>
      <i style="width:${(t.falta/larg)*100}%;background:var(--rosa)"></i>
    </div>
    <div class="legenda">
      <div><em style="background:var(--ouro)"></em>Já pago <b>${R$(t.pago)}</b></div>
      <div><em style="background:var(--rosa)"></em>A pagar <b>${R$(t.falta)}</b></div>
    </div>
    ${D.orcamento? (t.contratado>D.orcamento
      ? `<div style="margin-top:11px;font-size:12.5px;color:var(--rosa)">As escolhas passaram ${R$(t.contratado-D.orcamento)} do teto.</div>`
      : `<div style="margin-top:11px;font-size:12.5px;color:var(--cinza)">Sobra do teto: <b style="color:var(--tinta)">${R$(D.orcamento-t.contratado)}</b></div>`) : ''}
    <div class="campo" style="margin:13px 0 0"><label>Teto do orçamento</label>
      <input type="number" value="${D.orcamento||''}" placeholder="0,00" onchange="D.orcamento=+this.value||0;salvar();render()"></div>
  </div>

  <div class="grade">
    <div class="mini"><div class="rot">Custo por pessoa</div><div class="num">${t.pessoas?R$(t.contratado/t.pessoas):'—'}</div><div class="pe">${t.pessoas} na lista</div></div>
    <div class="mini"><div class="rot">Falta fechar</div><div class="num">${faltaFechar.length}</div><div class="pe">categoria(s) sem escolha</div></div>
  </div>

  <div class="secao-titulo">Item a item</div>
  ${escolhidas.length?`<div class="cartao">
    <table class="res">
      <tr><th>Item</th><th>Contratado</th><th>Pago</th><th>Falta</th></tr>
      ${escolhidas.map(x=>`<tr>
        <td>${esc(x.c.nome)}<div style="font-size:11px;color:var(--cinza);font-weight:400">${esc(x.e.fornecedor)}</div></td>
        <td>${R$(x.e.valor)}</td>
        <td style="color:#8A6212">${R$(x.e.pago||0)}</td>
        <td style="color:var(--rosa)">${R$(Math.max(x.e.valor-(x.e.pago||0),0))}</td></tr>`).join('')}
      <tr style="font-weight:600"><td>Total</td><td>${R$(t.contratado)}</td><td>${R$(t.pago)}</td><td>${R$(t.falta)}</td></tr>
    </table>
  </div>

  <div class="secao-titulo">Registrar pagamento</div>
  ${escolhidas.map(x=>`
    <div class="linha-item">
      <div class="corpo"><div class="nome">${esc(x.c.nome)}</div><div class="sub">${esc(x.e.fornecedor)} · total ${R$(x.e.valor)}</div></div>
      <input type="number" value="${x.e.pago||0}" style="width:108px;text-align:right" onchange="setPago(${x.c.id},${x.e.id},this.value)">
    </div>`).join('')}`
  :'<div class="vazio">Escolha as cotações na aba <b>Cotações</b> para o total aparecer aqui.</div>'}

  ${faltaFechar.length?`<div class="cartao" style="font-size:12.5px;color:var(--cinza)">
    <b style="color:var(--tinta)">Ainda sem cotação escolhida:</b> ${faltaFechar.map(c=>esc(c.nome)).join(' · ')}</div>`:''}
  `;
}

/* ==================== AÇÕES ==================== */
function addGasto(){
  const d=lerCamposGasto('g');
  if(d.erro) return toast(d.erro);
  D.gastos.push(Object.assign({id:novoId()},d));
  salvar(); render(); toast('Gasto lançado');
}
function editarGasto(id){ UI.editando=id; render(); }
function salvarEdicao(id){
  const d=lerCamposGasto('e');
  if(d.erro) return toast(d.erro);
  const g=D.gastos.find(x=>x.id===id);
  if(!g) { UI.editando=null; return render(); }
  const antes=g.parcelas;
  Object.assign(g,d);
  if(antes!==g.parcelas || !g.parcelado)
    D.parcelasPagas=(D.parcelasPagas||[]).filter(k=>k.split('-')[0]!=String(id));
  UI.editando=null; salvar(); render(); toast('Lançamento atualizado');
}
function apagarGasto(id){
  if(!confirm('Excluir este lançamento?')) return;
  D.gastos=D.gastos.filter(g=>g.id!==id);
  D.parcelasPagas=(D.parcelasPagas||[]).filter(k=>k.split('-')[0]!=String(id));
  salvar(); render();
}
function togglePaga(k){
  const s=pagasSet(); s.has(k)?s.delete(k):s.add(k);
  D.parcelasPagas=Array.from(s); salvar(); render();
}
function addConv(){
  const n=document.getElementById('cNome').value.trim();
  if(!n) return toast('Escreva o nome');
  D.convidados.push({id:novoId(),nome:n,lado:document.getElementById('cLado').value,
    grupo:document.getElementById('cGrupo').value.trim()||'Outros',
    acomp:0,
    crianca:document.getElementById('cKid').value==='1',
    status:document.getElementById('cStatus').value});
  salvar(); render(); toast('Convidado adicionado');
}
function apagarConv(id){
  if(!confirm('Remover da lista de convidados?')) return;
  D.convidados=D.convidados.filter(c=>c.id!==id); salvar(); render();
}
function escolher(catId,cotId){
  const c=D.categorias.find(x=>x.id===catId);
  const era=c.cotacoes.find(q=>q.id===cotId).escolhida;
  c.cotacoes.forEach(q=>q.escolhida=false);
  if(!era) c.cotacoes.find(q=>q.id===cotId).escolhida=true;
  UI.catAberta=catId; salvar(); render();
  toast(era?'Escolha desfeita':'Escolhido!');
}
function addCot(catId){
  const f=document.getElementById('f'+catId).value.trim();
  const v=parseFloat(document.getElementById('v'+catId).value);
  if(!f) return toast('Informe o fornecedor');
  if(!(v>=0)) return toast('Informe o valor');
  D.categorias.find(x=>x.id===catId).cotacoes.push({id:novoId(),fornecedor:f,valor:v,
    obs:document.getElementById('o'+catId).value.trim(),escolhida:false,pago:0});
  UI.catAberta=catId; salvar(); render(); toast('Cotação adicionada');
}
function apagarCot(catId,cotId){
  if(!confirm('Excluir esta cotação?')) return;
  const c=D.categorias.find(x=>x.id===catId);
  c.cotacoes=c.cotacoes.filter(q=>q.id!==cotId);
  UI.catAberta=catId; salvar(); render();
}
function addCat(){
  const el=document.getElementById('novaCat'), n=el.value.trim();
  if(!n) return toast('Dê um nome à categoria');
  D.categorias.push({id:novoId(),nome:n,cotacoes:[]}); el.value=''; salvar(); render(); toast('Categoria criada');
}
function apagarCat(id){
  const c=D.categorias.find(x=>x.id===id);
  if(!confirm('Excluir "'+c.nome+'" e todas as suas cotações?')) return;
  D.categorias=D.categorias.filter(x=>x.id!==id); salvar(); render();
}
function setPago(catId,cotId,v){
  const q=D.categorias.find(c=>c.id===catId).cotacoes.find(x=>x.id===cotId);
  q.pago=Math.min(Math.max(+v||0,0),q.valor); salvar(); render();
}

/* ==================== AJUSTES ==================== */
function abrirAjustes(){
  const s=SELOS[estado]||SELOS.local;
  document.getElementById('painelAjustes').innerHTML=`
    <h2>Ajustes</h2>
    <div id="seloSinc" class="sinc"><em class="${s[0]}"></em>${s[1]}</div>

    <div class="secao-titulo">O casamento</div>
    <div class="cartao">
      <div class="campo"><label>Nome do casal</label><input id="aNoivos" value="${esc(D.noivos)}" placeholder="Felipe & Gabriela"></div>
      <div class="campo"><label>Data do casamento</label><input id="aData" type="date" value="${D.dataCasamento||''}"></div>
      <div class="campo"><label>Teto do orçamento</label><input id="aOrc" type="number" value="${D.orcamento||''}" placeholder="0,00"></div>
      <button class="btn rosa" onclick="salvarAjustes()">Salvar</button>
    </div>

    <div style="text-align:center;font-size:11px;color:var(--cinza);margin-top:18px">
      Nosso Casamento · versão ${VERSAO}
    </div>
    <button class="btn claro" style="margin-top:12px" onclick="fecharAjustes()">Fechar</button>`;
  document.getElementById('modalAjustes').classList.add('on');
}
function fecharAjustes(){ document.getElementById('modalAjustes').classList.remove('on'); }
function salvarAjustes(){
  D.noivos=document.getElementById('aNoivos').value.trim()||'Felipe & Gabriela';
  D.dataCasamento=document.getElementById('aData').value;
  D.orcamento=+document.getElementById('aOrc').value||0;
  salvar(); render(); fecharAjustes(); toast('Ajustes salvos');
}

function addCatGasto(){
  const n=document.getElementById('novaCatGasto').value.trim();
  if(!n) return toast('Dê um nome à categoria');
  if(D.catsGasto.some(c=>c.toLowerCase()===n.toLowerCase())) return toast('Essa categoria já existe');
  D.catsGasto.push(n); salvar(); render(); toast('Categoria criada');
}
function apagarCatGasto(i){
  const nome=D.catsGasto[i];
  if(nome===undefined) return;
  if(D.catsGasto.length<=1) return toast('Deixe ao menos uma categoria');
  const usos=D.gastos.filter(g=>g.cat===nome).length;
  const aviso=usos
    ? 'A categoria "'+nome+'" tem '+usos+' lançamento(s). Eles continuam com esse nome, mas ela sai da lista. Continuar?'
    : 'Excluir a categoria "'+nome+'"?';
  if(!confirm(aviso)) return;
  D.catsGasto.splice(i,1); salvar(); render();
}

/* ==================== INFRA ==================== */
let timerToast=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(timerToast); timerToast=setTimeout(()=>el.classList.remove('on'),2200);
}

const ABAS=[['inicio','Início',telaInicio],['gastos','Gastos',telaGastos],
            ['ganhos','Ganhos',telaGanhos],
            ['grafico','Gráfico',telaGrafico],['casamento','Casamento',telaCasamento]];

function render(){
  const aba=ABAS.find(a=>a[0]===UI.aba)||ABAS[0];
  document.getElementById('tela').innerHTML=aba[2]();
  document.getElementById('nav').innerHTML=
    ABAS.slice(0,4).map(a=>`<button class="${a[0]==='ganhos'?'gan':''}" aria-current="${a[0]===UI.aba}" onclick="ir('${a[0]}')">${a[1]}</button>`).join('')
    +'<div class="divisor"></div>'
    +`<button class="cas" aria-current="${UI.aba==='casamento'}" onclick="ir('casamento')">Casamento</button>`;

  const cas=UI.aba==='casamento';
  document.getElementById('cab').className=cas?'casamento':'';
  document.getElementById('eyebrow').textContent=cas?'Casamento':'Financeiro';
  document.getElementById('verNum').textContent=VERSAO;
  document.getElementById('titulo').textContent=cas?D.noivos:'Minhas finanças';
  const num=document.getElementById('hNum'), txt=document.getElementById('hTxt');
  if(cas){
    if(D.dataCasamento){
      const alvo=new Date(D.dataCasamento+'T12:00:00'); const h=agora(); h.setHours(12,0,0,0);
      const dias=Math.round((alvo-h)/86400000);
      const p=D.dataCasamento.split('-');
      num.textContent = dias>0?dias:(dias===0?'Hoje!':'—');
      txt.textContent = dias>0 ? 'dias para '+(+p[2])+' de '+MESES[+p[1]-1]+' de '+p[0]
        : dias===0 ? 'é o grande dia' : 'casamento em '+(+p[2])+'/'+p[1]+'/'+p[0];
    } else { num.textContent='—'; txt.textContent='defina a data em ⚙ Ajustes'; }
  } else {
    const k=chaveMes(agora());
    const ent=entradasMes(k), sai=fluxoMes(k), saldo=ent-sai;
    if(ent){
      num.textContent=R$(Math.abs(saldo));
      txt.textContent=(saldo>=0?'sobrou em ':'faltou em ')+MESES[agora().getMonth()];
    } else {
      num.textContent=R$(sai);
      txt.textContent='gastos de '+MESES[agora().getMonth()];
    }
  }
}
function ir(a){ UI.aba=a; UI.editando=null; UI.editandoG=null; UI.editandoF=null; UI.editandoConv=null; render(); window.scrollTo(0,0); }

/* boot */
const salvo=lerLocal();
if(salvo && salvo.versao) D=normalizar(salvo);
if(importarLista()) salvar();
render();
carregarFirebase();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
