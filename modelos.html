<title>Previa - modelos de orcamento</title>

<style>
:root{--tinta:#12322A;--tinta2:#1D4A3E;--vinho:#3B1B27;--papel:#F2EEE4;--carta:#FFF;
--rosa:#B4566A;--ouro:#BE8724;--cinza:#6E7C74;--verde:#2E7D52;--azul:#4A6FA5;
--linha:rgba(18,50,42,.13);--display:'Fraunces',Georgia,serif;--texto:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--tinta);font-family:var(--texto);color:var(--tinta);font-size:15px;line-height:1.45}
#shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--papel);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:40px}
header{background:var(--vinho);color:var(--papel);padding:18px 20px 20px}
.eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(242,238,228,.6);margin:0 0 6px;font-weight:500}
header h1{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.headline{margin-top:12px;border-top:1px solid rgba(242,238,228,.18);padding-top:11px;font-size:12px;color:rgba(242,238,228,.75)}
.barra-conv{margin:14px 16px 0;background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:14px}
.barra-conv label{display:block;margin-bottom:8px}
.bc-campo{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
.bc-campo input{width:104px;text-align:center;font-family:var(--display);font-size:26px;font-weight:500;
padding:8px 6px;border:1px solid var(--linha);border-radius:12px;background:var(--papel);color:var(--tinta);
font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.bc-campo input::-webkit-outer-spin-button,.bc-campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bc-campo input:focus{outline:2px solid var(--vinho);outline-offset:1px}
.bc-un{font-size:13px;color:var(--cinza)}
.bc-lab{font-size:11.5px;color:var(--cinza);align-self:center;margin-right:2px}
.bc-btn{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bc-btn button{border:1px solid var(--linha);background:transparent;color:var(--cinza);padding:5px 9px;border-radius:99px;
font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--texto)}
.bc-btn button.on{background:var(--vinho);color:var(--papel);border-color:var(--vinho)}

.bc-nota{font-size:11.5px;color:var(--cinza);margin-top:9px;line-height:1.45}
.bc-alerta{font-size:12px;color:var(--rosa);background:rgba(180,86,106,.08);padding:8px 10px;border-radius:8px;margin-top:9px;line-height:1.4}
.sim-box{background:rgba(74,111,165,.06);border:1px dashed rgba(74,111,165,.4);border-radius:12px;padding:12px 13px;margin-top:14px}
.sb-tit{font-size:12px;font-weight:600;color:#3B5C8A;margin-bottom:9px;line-height:1.4}
.sb-linha{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;gap:10px}
.sb-linha b{font-variant-numeric:tabular-nums;font-weight:600}
.sb-nota{font-size:11.5px;color:var(--cinza);margin-top:8px;line-height:1.45}
.sb-alerta{font-size:12.5px;color:var(--rosa);line-height:1.4}
.orc.fora{opacity:.55}
.orc.fora .oc-val{color:var(--rosa)}
.faixa{font-size:11px;color:var(--cinza)}
.modelos{display:flex;gap:6px;padding:14px 16px 0}
.modelos button{flex:1;border:1px solid var(--linha);background:var(--carta);color:var(--cinza);padding:9px 4px;border-radius:10px;
font-family:var(--texto);font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.25}
.modelos button[aria-pressed="true"]{background:var(--vinho);color:var(--papel);border-color:var(--vinho)}
main{padding:14px 16px 8px}
.nota{background:rgba(190,135,36,.1);border-left:3px solid var(--ouro);padding:11px 13px;font-size:12.5px;color:#6B5417;margin-bottom:14px;border-radius:0 10px 10px 0}
.secao-titulo{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:20px 2px 9px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:10px}
.rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.val{font-family:var(--display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(18,50,42,.07);color:var(--cinza)}
.tag.ok{background:rgba(190,135,36,.16);color:#8A6212}
.tag.pp{background:rgba(74,111,165,.13);color:#3B5C8A}

.orc{background:var(--carta);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;overflow:hidden}
.orc.esc{border-color:var(--ouro);box-shadow:inset 3px 0 0 var(--ouro)}
.orc>summary{list-style:none;cursor:pointer;padding:13px 14px}
.orc>summary::-webkit-details-marker{display:none}
.oc-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-nome{font-weight:600;font-size:15px}
.oc-sub{font-size:11.5px;color:var(--cinza);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.oc-val{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.oc-pp{font-size:11px;color:var(--cinza);font-variant-numeric:tabular-nums}
.corpo{border-top:1px solid var(--linha);padding:13px 14px}
.bloco{margin-bottom:15px}
.bloco:last-child{margin-bottom:0}
.bt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin-bottom:7px}
.li{display:flex;gap:8px;font-size:13px;margin-bottom:5px;align-items:flex-start;line-height:1.4}
.li .mk{color:var(--verde);flex:none;font-size:12px;line-height:1.5}
.li .mk.no{color:var(--rosa)}
.linhav{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--linha);gap:10px}
.linhav:first-child{border-top:0}
.linhav b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.total{display:flex;justify-content:space-between;padding-top:9px;margin-top:3px;border-top:1px solid var(--linha);font-weight:600;font-size:14px}
.total b{font-family:var(--display);font-variant-numeric:tabular-nums}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.ficha dt{color:var(--cinza)}
.ficha dd{margin:0;text-align:right;font-weight:500}
.alerta{font-size:12px;color:#8A6212;background:rgba(190,135,36,.1);padding:9px 11px;border-radius:8px;margin-top:12px}
.add{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--linha);font-size:13px}
.add:first-child{border-top:0}
.add .nm{flex:1;line-height:1.35}
.add b{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.sw{width:38px;height:22px;border-radius:99px;background:rgba(18,50,42,.15);position:relative;flex:none;cursor:pointer;border:0;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:transform .15s}
.sw.on{background:var(--ouro)}
.sw.on::after{transform:translateX(16px)}
.btn{width:100%;padding:11px;border:1px solid var(--linha);border-radius:10px;background:transparent;color:var(--tinta);
font-family:var(--texto);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.on{background:var(--ouro);border-color:var(--ouro);color:#fff}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.cmp th,table.cmp td{padding:8px 6px;border-top:1px solid var(--linha);text-align:center;vertical-align:top;word-break:break-word}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;width:31%;color:var(--cinza);font-weight:500}
table.cmp thead th{border-top:0;font-size:11.5px;font-weight:600;line-height:1.3;padding-bottom:10px}
table.cmp .num{font-variant-numeric:tabular-nums;font-weight:500}
table.cmp .best{color:var(--verde);font-weight:600}
table.cmp .sim{color:var(--verde)}
table.cmp .nao{color:var(--rosa)}
.rodape{font-size:12px;color:var(--cinza);padding:4px 2px 0;line-height:1.5}
</style>

00": 70524, "150": 89247, "200": 110372, "250": 129581, "300": 148963}, "cotado": 89247}, {"id": 3, "cat": "Pacote completo", "fornecedor": "Porto Real Beira Lago", "pessoas": 150, "local": "Lago Paranoá", "duracao": "5h recepção + 2h cerimônia", "validade": "10 dias", "pagamento": "Sinal 20% + parcelado", "contato": "(61) 3346-9117 · Weslley/Bianca", "itens": [["Espaço, buffet Imperador, decoração Criart's e som Sogni (sábado)", 103250]], "inclui": ["Até 700 convidados, cerimônia às margens do lago", "Gerador 260 KVA, ECAD, cozinha industrial", "Buffet do Chef com 2 ilhas, medalhão e robalo", "Coquetel volante full time com frutos do mar", "Decoração completa da recepção e mesa do bolo", "Som, iluminação e DJ profissional"], "naoInclui": ["Decoração da cerimônia", "Bebida alcoólica", "Manobrista e orientador de trânsito"], "adicionais": [["Decoração da cerimônia", 7900], ["After party no deck (2h)", 11000], ["Manobrista (150 convidados)", 2500], ["Orientador de trânsito", 750], ["Backline para banda", 2000], ["Painel de led no teto", 2500], ["Piso Gold", 1800], ["Cerveja Heineken (150 × R$ 25)", 3750]], "alerta": "Decoração e buffet são exclusivos da casa", "cap": 700, "porPessoa": [["Cerveja Heineken", 25]], "fixo": 0, "desc": 0, "tabela": {"150": 103250}, "cotado": 103250}, {"id": 4, "cat": "Espaço", "fornecedor": "Lacustre Hall", "pessoas": 600, "local": "Asa Sul", "duracao": "5 horas", "validade": "15 dias", "pagamento": "30% no contrato + parcelado", "contato": "(61) 9 9949-7879", "itens": [["Locação 6ª ou sábado (jan e nov/27)", 28000]], "inclui": ["Salão climatizado com acessibilidade", "30 mesas redondas de 8 lugares", "Suíte VIP", "Estacionamento amplo gratuito", "Gerente, segurança, brigadistas e limpeza", "Gerador em stand-by"], "naoInclui": ["Buffet", "Decoração", "Som"], "adicionais": [["Gerador, se precisar ligar", 2300]], "alerta": "Buffet e decoração só de fornecedores cadastrados", "cap": 600, "porPessoa": [], "fixo": 28000, "desc": 0, "cotado": 28000}, {"id": 5, "cat": "Espaço", "fornecedor": "Villa Bé", "pessoas": 450, "local": "Gama", "duracao": "7 horas", "validade": "7 dias", "pagamento": "10% entrada + boleto", "contato": "—", "itens": [["Locação sábado ou feriado", 48000]], "inclui": ["Salão para até 450 convidados", "Gerador 170 kva e taxa de ECAD", "20 mesas de 8 lugares e 200 cadeiras", "Suíte da noiva e chalé do noivo", "160 vagas de estacionamento", "2 ensaios fotográficos"], "naoInclui": ["Buffet", "Decoração", "Brigadistas"], "adicionais": [], "alerta": "Proposta válida por 7 dias", "cap": 450, "porPessoa": [], "fixo": 48000, "desc": 0, "cotado": 48000}, {"id": 6, "cat": "Espaço", "fornecedor": "Green Park", "pessoas": 150, "local": "Park Way", "duracao": "6 horas", "validade": "—", "pagamento": "—", "contato": "(61) 99982-7981 · Wilson", "itens": [["Locação até 100 convidados", 10900], ["50 convidados adicionais (× R$ 50)", 2500]], "inclui": ["Salão, cozinha, churrasqueira e bar", "Gazebo e área gramada para cerimônia", "Mobiliário rústico completo", "Passarela e porta de madeira para cerimônia", "Sala para maquiagem da noiva"], "naoInclui": ["Buffet", "Decoração", "Gerador"], "adicionais": [["Taxa de ECAD", 750]], "alerta": "Limite máximo de 150 convidados", "cap": 150, "porPessoa": [], "fixo": 10900, "desc": 0, "adicPessoa": 50, "incluso": 100, "cotado": 13400}, {"id": 7, "cat": "Espaço + decoração", "fornecedor": "Maison Daniela", "pessoas": 130, "local": "—", "duracao": "6 horas", "validade": "3 dias úteis", "pagamento": "Pix ou boleto · 50% + 50%", "contato": "(61) 99183-4477", "itens": [["Pacote Espaço + Decoração (até 130)", 18980]], "inclui": ["Espaço coberto e ao ar livre", "Lago, praia artificial e jardins", "250 cadeiras e 30 mesas", "Decoração da cerimônia e da recepção", "Camarim e sala de making of", "Cozinha industrial"], "naoInclui": ["Buffet", "Som", "Taxa de staff"], "adicionais": [["Taxa de staff", 800]], "alerta": "Até 40% de desconto de 2ª a 5ª · 10% às 6ª e domingos", "cap": 130, "porPessoa": [], "fixo": 18980, "desc": 0, "cotado": 18980}, {"id": 8, "cat": "Buffet", "fornecedor": "Castro's Buffet", "pessoas": 180, "local": "Vicente Pires", "duracao": "5 horas", "validade": "tabela 2026", "pagamento": "Parcelado até o evento", "contato": "(61) 4141-3086 · Erick", "itens": [["Coquetel volante (180 × R$ 134)", 24120]], "inclui": ["Coquetel volante durante todo o evento", "15 sabores de salgados", "Bebidas não alcoólicas", "1 garçom para cada 14 convidados", "Louça, prataria e material completo", "3 cortesias à escolha"], "naoInclui": ["Jantar (é ilha adicional)", "Bolo e doces", "Bebida alcoólica"], "adicionais": [["Ilha de jantar (180 × R$ 44)", 7920], ["Bolo e doces (180 × R$ 26,50)", 4770], ["Ilha de grelhados (180 × R$ 46)", 8280], ["Cerveja Antártica (180 × R$ 14)", 2520]], "alerta": "Tabela 2026 — reajuste de 10% para 2027 · crianças até 8 anos não pagam", "cap": 500, "porPessoa": [["Coquetel volante", 134], ["Ilha de jantar", 44], ["Bolo e doces", 26.5], ["Ilha de grelhados", 46], ["Cerveja Antártica", 14]], "fixo": 0, "desc": 0, "cotado": 24120}];
const S={modelo:1,adicionais:{},escolhida:{},pessoas:235};
O.forEach(o=>{S.adicionais[o.id]={};});
const R$=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=()=>S.pessoas;
/* valor que o fornecedor efetivamente cotou, para a quantidade que ele cotou */
const cotado=o=>o.cotado;
const ppCotado=o=>o.cotado/o.pessoas;
const simulando=o=>N()!==o.pessoas;
/* estimativa nossa, quando ela quer ver outra quantidade */
function estimativa(o){
  const n=N();
  if(o.tabela){                      // pacote com tabela por faixa
    const fx=Object.keys(o.tabela).map(Number).sort((a,b)=>a-b);
    let f=fx[fx.length-1];
    for(const x of fx){ if(n<=x){ f=x; break; } }
    return o.tabela[f];
  }
  if(o.adicPessoa){                  // valor fixo + por convidado extra
    return o.fixo + Math.max(0,n-o.incluso)*o.adicPessoa;
  }
  const pp=(o.porPessoa||[]).length?o.porPessoa[0][1]*n:0;
  return o.fixo + pp - (o.desc||0);
}
function precisaRecotar(o){ return o.soConsulta && N()>o.soConsulta; }
function faixa(o){
  if(!o.tabela) return null;
  const fx=Object.keys(o.tabela).map(Number).sort((a,b)=>a-b);
  let f=fx[fx.length-1];
  for(const x of fx){ if(N()<=x){ f=x; break; } }
  return f;
}
const cabe=o=>N()<=o.cap;
const valorAdic=(o,i)=>o.adicionais[i][1];
const rotAdic=(o,i)=>o.adicionais[i][0];
const extras=o=>o.adicionais.reduce((s,a,i)=>s+(S.adicionais[o.id][i]?a[1]:0),0);
const total=o=>cotado(o)+extras(o);
const porPessoa=o=>o.pessoas?total(o)/o.pessoas:0;

function blocoSim(o){
  const est=estimativa(o), n=N();
  const naoCabe=!cabe(o);
  const temTabela=!!o.tabela, faixaOk=temTabela&&faixa(o);
  return `<div class="sim-box">
    <div class="sb-tit">Voce quer ${n} convidados &mdash; a proposta e para ${o.pessoas}</div>
    ${naoCabe
      ? `<div class="sb-alerta">Este local comporta no maximo ${o.cap} pessoas. Nao da para ${n}.</div>`
      : (o.porPessoa&&o.porPessoa.length)||o.adicPessoa||faixaOk
        ? `<div class="sb-linha"><span>Estimativa para ${n} pessoas</span><b>${R$(est)}</b></div>
           <div class="sb-linha"><span>Ficaria por pessoa</span><b>${R$(est/n)}</b></div>
           <div class="sb-nota">Conta feita por mim com base na tabela da proposta. <b>Nao e o valor oficial</b> &mdash; peca um orcamento novo para ${n} pessoas.</div>`
        : `<div class="sb-nota">A proposta e um valor fechado para ${o.pessoas} pessoas, entao nao da para estimar ${n}. Peca um orcamento novo.</div>`}
  </div>`;
}

            </div>
            <div><div class="oc-val">${R$(cotado(o))}</div>
              <div class="oc-pp">${R$(ppCotado(o))} por pessoa</div></div>
          </div>
        </summary>
        <div class="corpo">
          ${o.porPessoa&&o.porPessoa.length?`<div class="bloco"><div class="bt">Como a proposta se forma</div>
            <div class="linhav"><span>${esc(o.porPessoa[0][0])} &mdash; ${o.pessoas} &times; ${R$(o.porPessoa[0][1])}</span><b>${R$(o.porPessoa[0][1]*o.pessoas)}</b></div>
            ${o.fixo?`<div class="linhav"><span>Valor fixo (salao, decoracao, servicos)</span><b>${R$(o.fixo)}</b></div>`:''}
            ${o.desc?`<div class="linhav"><span>Desconto concedido</span><b>-${R$(o.desc)}</b></div>`:''}
            <div class="total"><span>Total cotado</span><b>${R$(cotado(o))}</b></div></div>`
           :o.adicPessoa?`<div class="bloco"><div class="bt">Como a proposta se forma</div>
            <div class="linhav"><span>Locacao ate ${o.incluso} convidados</span><b>${R$(o.fixo)}</b></div>
            <div class="linhav"><span>${o.pessoas-o.incluso} convidados adicionais &times; ${R$(o.adicPessoa)}</span><b>${R$((o.pessoas-o.incluso)*o.adicPessoa)}</b></div>
            <div class="total"><span>Total cotado</span><b>${R$(cotado(o))}</b></div></div>`
           :o.tabela?`<div class="bloco"><div class="bt">Tabela do fornecedor</div>
            ${Object.keys(o.tabela).map(k=>`<div class="linhav" style="${+k===o.pessoas?'font-weight:600':'color:var(--cinza)'}"><span>${k} pessoas</span><b>${R$(o.tabela[k])}</b></div>`).join('')}</div>`:''}
          ${simulando(o)?blocoSim(o):''}
          <div class="bloco"><div class="bt">O que inclui</div>
            ${o.inclui.map(t=>`<div class="li"><span class="mk">&#10003;</span><span>${esc(t)}</span></div>`).join('')}</div>
          ${o.naoInclui.length?`<div class="bloco"><div class="bt">Nao incluso</div>
            ${o.naoInclui.map(t=>`<div class="li"><span class="mk no">&times;</span><span>${esc(t)}</span></div>`).join('')}</div>`:''}
          ${o.adicionais.length?`<div class="bloco"><div class="bt">Adicionais disponiveis</div>
            ${o.adicionais.map(a=>`<div class="linhav"><span>${esc(a[0])}</span><b>${R$(a[1])}</b></div>`).join('')}</div>`:''}
          <div class="bloco"><div class="bt">A proposta</div>
            <dl class="ficha">
              <dt>Duracao</dt><dd>${esc(o.duracao)}</dd>
              <dt>Validade</dt><dd>${esc(o.validade)}</dd>
              <dt>Pagamento</dt><dd>${esc(o.pagamento)}</dd>
              <dt>Contato</dt><dd>${esc(o.contato)}</dd>
            </dl></div>
          ${o.alerta?`<div class="alerta">${esc(o.alerta)}</div>`:''}
        </div>
      </details>`).join('');
    }).join('');
}

/* ---------- MODELO 2 ---------- */
function m2(){
  return `<div class="nota"><b>Modelo 2 &mdash; simulador.</b> Os adicionais tem chave liga/desliga. O total do orcamento e o valor por pessoa recalculam na hora, entao da pra montar cenarios antes de decidir.</div>`
  + O.filter(o=>o.adicionais.length).map(o=>{
    const lig=o.adicionais.filter((a,i)=>S.adicionais[o.id][i]).length;
    return `<details class="orc ${cabe(o)?'':'fora'}" ${o.id===1?'open':''}>
      <summary>
        <div class="oc-topo">
          <div style="min-width:0">
            <div class="oc-nome">${esc(o.fornecedor)}</div>
            <div class="oc-sub"><span class="tag pp">cotado p/ ${o.pessoas}</span>
              ${lig?`<span class="tag ok">+${lig} adicional(is)</span>`:''}</div>
          </div>
          <div><div class="oc-val">${R$(total(o))}</div>
            <div class="oc-pp">${R$(porPessoa(o))} por pessoa</div></div>
        </div>
      </summary>
      <div class="corpo">
        <div class="bloco"><div class="bt">Proposta como foi cotada &mdash; ${o.pessoas} pessoas</div>
          ${o.itens.map(i=>`<div class="linhav"><span>${esc(i[0])}</span><b>${R$(i[1])}</b></div>`).join('')}
          <div class="total"><span>Subtotal</span><b>${R$(cotado(o))}</b></div></div>
        <div class="bloco"><div class="bt">Adicionais &mdash; ligue o que quiser somar</div>
          ${o.adicionais.map((a,i)=>`<div class="add">
            <button class="sw ${S.adicionais[o.id][i]?'on':''}" onclick="tog(${o.id},${i})" aria-label="${esc(a[0])}"></button>
            <span class="nm">${esc(rotAdic(o,i))}</span><b>${R$(valorAdic(o,i))}</b></div>`).join('')}
          ${extras(o)?`<div class="total"><span>Somado</span><b>${R$(extras(o))}</b></div>`:''}</div>
        <div class="cartao" style="margin:0;background:var(--papel);border-style:dashed">
          <div style="display:flex;justify-content:space-between;align-items:flex-end">
            <div><span class="rot">Total com os adicionais</span><b class="val">${R$(total(o))}</b></div>
            <div style="text-align:right"><span class="rot">Por pessoa</span>
              <b class="val" style="font-size:16px;color:var(--cinza)">${R$(porPessoa(o))}</b></div>
          </div>
        </div>
        ${simulando(o)?blocoSim(o):''}
        <button class="btn ${S.escolhida[o.id]?'on':''}" onclick="escolher(${o.id})">
          ${S.escolhida[o.id]?'&#10003; Escolhido':'Marcar como escolhido'}</button>
      </div>
    </details>`;}).join('');
}

/* ---------- MODELO 3 ---------- */
function m3(){
  const c=[O[0],O[1],O[2]];
  const menor=Math.min.apply(null,c.map(o=>ppCotado(o)));
  const lin=(rot,fn)=>`<tr><td>${rot}</td>${c.map(o=>`<td>${fn(o)}</td>`).join('')}</tr>`;
  const temItem=(o,t)=>o.inclui.concat(o.itens.map(i=>i[0])).join(' ').toLowerCase().indexOf(t)>=0
    ? '<span class="sim">&#10003;</span>' : '<span class="nao">&times;</span>';
  return `<div class="nota"><b>Modelo 3 &mdash; comparador.</b> Poe os orcamentos lado a lado nas mesmas linhas. Serve para bater o que um tem e o outro nao, sem precisar abrir proposta por proposta.</div>
  <div class="cartao">
    <table class="cmp">
      <thead><tr><th></th>${c.map(o=>`<th>${esc(o.fornecedor)}</th>`).join('')}</tr></thead>
      <tbody>
        ${lin('Cotado para',o=>'<span class="num">'+o.pessoas+' pessoas</span>')}
        ${lin('Valor cotado',o=>'<span class="num">'+R$(cotado(o))+'</span>')}
        ${lin('Por pessoa',o=>'<span class="num '+(ppCotado(o)===menor?'best':'')+'">'+R$(ppCotado(o))+'</span>')}
        ${lin('Estimativa p/ '+N(),o=>!cabe(o)?'<span class="nao">nao cabe</span>':(simulando(o)?'<span class="num" style="color:var(--cinza)">'+R$(estimativa(o))+'</span>':'<span class="num">&mdash;</span>'))}
        ${lin('Buffet',o=>temItem(o,'buffet'))}
        ${lin('Decoracao',o=>temItem(o,'decora'))}
        ${lin('Som e DJ',o=>temItem(o,'som'))}
        ${lin('Bolo e doces',o=>temItem(o,'doce'))}
        ${lin('Cerimonia',o=>temItem(o,'cerim'))}
        ${lin('Gerador',o=>temItem(o,'gerador'))}
        ${lin('Validade',o=>esc(o.validade))}
      </tbody>
    </table>
    <div class="rodape" style="border-top:1px solid var(--linha);margin-top:10px;padding-top:10px">
      Em verde, o menor custo por pessoa entre os valores <b>cotados</b>. A linha de estimativa e conta minha, nao vale como proposta &mdash; serve so para ter ideia.
    </div>
  </div>
  <div class="secao-titulo">Falta somar em cada um</div>
  ${c.map(o=>`<div class="cartao" style="padding:12px 14px">
    <div style="font-weight:600;font-size:14px;margin-bottom:6px">${esc(o.fornecedor)}</div>
    ${o.naoInclui.map(t=>`<div class="li"><span class="mk no">&times;</span><span>${esc(t)}</span></div>`).join('')}
    ${o.adicionais.length?`<div style="font-size:12px;color:var(--cinza);margin-top:8px">
      Adicionais somam ate <b style="color:var(--tinta)">${R$(o.adicionais.reduce((s,a)=>s+a[1],0))}</b></div>`:''}
  </div>`).join('')}`;
}

function tog(id,i){S.adicionais[id][i]=!S.adicionais[id][i];render();}
function escolher(id){S.escolhida[id]=!S.escolhida[id];render();}
function barra(){
  const n=N();
  const fora=O.filter(o=>!cabe(o));
  return `<div class="barra-conv">
    <label class="rot" for="qtd">Quantos convidados?</label>
    <div class="bc-campo">
      <input id="qtd" type="number" inputmode="numeric" min="1" max="999" value="${n}"
             oninput="digitou(this)" onblur="ajusta(this)">
      <span class="bc-un">convidados</span>
    </div>
    <div class="bc-btn">
      <span class="bc-lab">Cotados:</span>
      ${[[130,'Maison'],[150,'Panorama, Porto Real, Green Park'],[170,'Recanto'],[180,'Castro\'s'],[235,'lista de hoje']]
        .map(v=>`<button class="${n===v[0]?'on':''}" onclick="setN(${v[0]})" title="${v[1]}">${v[0]}</button>`).join('')}
    </div>
    <div class="bc-nota">Os orcamentos aparecem <b>com o valor e a quantidade que cada fornecedor cotou</b>. Escreva aqui outra quantidade e eu mostro uma estimativa em cada um &mdash; util para saber se vale pedir um orcamento novo.</div>
    ${fora.length?`<div class="bc-alerta">Nao comporta ${n} convidados: <b>${fora.map(o=>o.fornecedor).join(', ')}</b></div>`:''}
  </div>`;
}
function setN(v){
  S.pessoas=Math.min(Math.max(1,v||1),999);
  render();
}
function digitou(el){
  const v=parseInt(el.value,10);
  if(!el.value){ return; }
  if(isNaN(v)||v<1) return;
  S.pessoas=Math.min(v,999);
  const pos=el.selectionStart;
  render();
  const novo=document.getElementById('qtd');
  if(novo){ novo.focus(); try{ novo.setSelectionRange(pos,pos); }catch(e){} }
}
function ajusta(el){ if(!el.value||+el.value<1) setN(S.pessoas); }
function render(){
  document.getElementById('mods').innerHTML=[[1,'Ficha completa'],[2,'Simulador'],[3,'Comparador']].map(m=>
    `<button aria-pressed="${S.modelo===m[0]}" onclick="S.modelo=${m[0]};render();window.scrollTo(0,0)">${m[1]}</button>`).join('');
  document.getElementById('barra').innerHTML=barra();
  document.getElementById('tela').innerHTML=S.modelo===1?m1():S.modelo===2?m2():m3();
}
render();
</script>
