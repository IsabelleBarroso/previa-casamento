<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Previa - modelos de orcamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tinta:#12322A;--tinta2:#1D4A3E;--vinho:#3B1B27;--papel:#F2EEE4;--carta:#FFF;
--rosa:#B4566A;--ouro:#BE8724;--cinza:#6E7C74;--verde:#2E7D52;--azul:#4A6FA5;
--linha:rgba(18,50,42,.13);--display:'Fraunces',Georgia,serif;--texto:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--tinta);font-family:var(--texto);color:var(--tinta);font-size:15px;line-height:1.45}
#shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--papel);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:40px}
header{background:var(--vinho);color:var(--papel);padding:18px 20px 20px}
.eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(242,238,228,.6);margin:0 0 6px;font-weight:500}
header h1{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.headline{margin-top:12px;border-top:1px solid rgba(242,238,228,.18);padding-top:11px;font-size:12px;color:rgba(242,238,228,.75)}
.modelos{display:flex;gap:6px;padding:14px 16px 0}
.modelos button{flex:1;border:1px solid var(--linha);background:var(--carta);color:var(--cinza);padding:9px 4px;border-radius:10px;
font-family:var(--texto);font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.25}
.modelos button[aria-pressed="true"]{background:var(--vinho);color:var(--papel);border-color:var(--vinho)}
main{padding:14px 16px 8px}
.nota{background:rgba(190,135,36,.1);border-left:3px solid var(--ouro);padding:11px 13px;font-size:12.5px;color:#6B5417;margin-bottom:14px;border-radius:0 10px 10px 0}
.secao-titulo{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:20px 2px 9px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:10px}
.rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.val{font-family:var(--display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(18,50,42,.07);color:var(--cinza)}
.tag.ok{background:rgba(190,135,36,.16);color:#8A6212}
.tag.pp{background:rgba(74,111,165,.13);color:#3B5C8A}

.orc{background:var(--carta);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;overflow:hidden}
.orc.esc{border-color:var(--ouro);box-shadow:inset 3px 0 0 var(--ouro)}
.orc>summary{list-style:none;cursor:pointer;padding:13px 14px}
.orc>summary::-webkit-details-marker{display:none}
.oc-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-nome{font-weight:600;font-size:15px}
.oc-sub{font-size:11.5px;color:var(--cinza);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.oc-val{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.oc-pp{font-size:11px;color:var(--cinza);font-variant-numeric:tabular-nums}
.corpo{border-top:1px solid var(--linha);padding:13px 14px}
.bloco{margin-bottom:15px}
.bloco:last-child{margin-bottom:0}
.bt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin-bottom:7px}
.li{display:flex;gap:8px;font-size:13px;margin-bottom:5px;align-items:flex-start;line-height:1.4}
.li .mk{color:var(--verde);flex:none;font-size:12px;line-height:1.5}
.li .mk.no{color:var(--rosa)}
.linhav{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--linha);gap:10px}
.linhav:first-child{border-top:0}
.linhav b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.total{display:flex;justify-content:space-between;padding-top:9px;margin-top:3px;border-top:1px solid var(--linha);font-weight:600;font-size:14px}
.total b{font-family:var(--display);font-variant-numeric:tabular-nums}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.ficha dt{color:var(--cinza)}
.ficha dd{margin:0;text-align:right;font-weight:500}
.alerta{font-size:12px;color:#8A6212;background:rgba(190,135,36,.1);padding:9px 11px;border-radius:8px;margin-top:12px}
.add{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--linha);font-size:13px}
.add:first-child{border-top:0}
.add .nm{flex:1;line-height:1.35}
.add b{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.sw{width:38px;height:22px;border-radius:99px;background:rgba(18,50,42,.15);position:relative;flex:none;cursor:pointer;border:0;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:transform .15s}
.sw.on{background:var(--ouro)}
.sw.on::after{transform:translateX(16px)}
.btn{width:100%;padding:11px;border:1px solid var(--linha);border-radius:10px;background:transparent;color:var(--tinta);
font-family:var(--texto);font-size:13.5px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.on{background:var(--ouro);border-color:var(--ouro);color:#fff}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.cmp th,table.cmp td{padding:8px 6px;border-top:1px solid var(--linha);text-align:center;vertical-align:top;word-break:break-word}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;width:31%;color:var(--cinza);font-weight:500}
table.cmp thead th{border-top:0;font-size:11.5px;font-weight:600;line-height:1.3;padding-bottom:10px}
table.cmp .num{font-variant-numeric:tabular-nums;font-weight:500}
table.cmp .best{color:var(--verde);font-weight:600}
table.cmp .sim{color:var(--verde)}
table.cmp .nao{color:var(--rosa)}
.rodape{font-size:12px;color:var(--cinza);padding:4px 2px 0;line-height:1.5}
</style>
<div id="shell">
  <header>
    <p class="eyebrow">Casamento &middot; cotacoes</p>
    <h1>Felipe &amp; Gabriela</h1>
    <div class="headline">Tres modelos para organizar os orcamentos. Toque para trocar.</div>
  </header>
  <div class="modelos" id="mods"></div>
  <main id="tela"></main>
</div>
<script>
const O=[{"id": 1, "cat": "Pacote completo", "fornecedor": "Recanto Oásis", "pessoas": 170, "local": "Vicente Pires", "duracao": "5 horas", "validade": "tabela 2026", "pagamento": "Parcelado até o evento", "contato": "(61) 3397-1553 · Erick", "itens": [["Buffet jantar (170 × R$ 179)", 30430], ["Salão, mobiliário e serviços", 13999], ["Decoração e flores", 17196], ["Desconto concedido", -625]], "inclui": ["Salão para 170 convidados", "ECAD, 3 seguranças e limpeza", "18 toalhas, mesa do bolo, mesas de buffet", "Flores da estação para salão e cerimônia", "Buffet completo com jantar", "Coquetel volante durante todo o evento"], "naoInclui": ["Bolo e doces", "Bebida alcoólica", "Manobrista", "Cadeiras Tiffany"], "adicionais": [["Bolo e doces (170 × R$ 24,50)", 4165], ["170 cadeiras Tiffany transparente", 2340], ["Passarela de madeira para cerimônia", 1500], ["Porta na cerimônia", 650], ["Ilha de puff com árvore", 600], ["Manobrista", 2000], ["Cerveja Antártica (170 × R$ 12)", 2040]], "alerta": "Tabela de 2026 — datas de 2027 têm reajuste de 10%"}, {"id": 2, "cat": "Pacote completo", "fornecedor": "Espaço Panorama", "pessoas": 250, "local": "Brasília", "duracao": "—", "validade": "30/08/2026", "pagamento": "—", "contato": "(61) 9 9403-1540 · Ginnê", "itens": [["Espaço, mobiliário, buffet e doces (250 pessoas, sábado, com cerimônia)", 129581]], "inclui": ["Salão, limpeza, gerente, gerador e eletricista", "5 orientadores de trânsito e 5 seguranças", "2 brigadistas", "Mobiliário completo e 240 cadeiras Dior", "Mobiliário da cerimônia, altar e arco", "Coquetel volante com jantar", "1.000 doces finos, 250 bem-casados e bolo de 12 kg"], "naoInclui": ["Bebida alcoólica", "Som e iluminação", "Decoração floral"], "adicionais": [], "alerta": "Proposta válida até 30/08/2026"}, {"id": 3, "cat": "Pacote completo", "fornecedor": "Porto Real Beira Lago", "pessoas": 150, "local": "Lago Paranoá", "duracao": "5h recepção + 2h cerimônia", "validade": "10 dias", "pagamento": "Sinal 20% + parcelado", "contato": "(61) 3346-9117 · Weslley/Bianca", "itens": [["Espaço, buffet Imperador, decoração Criart's e som Sogni (sábado)", 103250]], "inclui": ["Até 700 convidados, cerimônia às margens do lago", "Gerador 260 KVA, ECAD, cozinha industrial", "Buffet do Chef com 2 ilhas, medalhão e robalo", "Coquetel volante full time com frutos do mar", "Decoração completa da recepção e mesa do bolo", "Som, iluminação e DJ profissional"], "naoInclui": ["Decoração da cerimônia", "Bebida alcoólica", "Manobrista e orientador de trânsito"], "adicionais": [["Decoração da cerimônia", 7900], ["After party no deck (2h)", 11000], ["Manobrista (150 convidados)", 2500], ["Orientador de trânsito", 750], ["Backline para banda", 2000], ["Painel de led no teto", 2500], ["Piso Gold", 1800], ["Cerveja Heineken (150 × R$ 25)", 3750]], "alerta": "Decoração e buffet são exclusivos da casa"}, {"id": 4, "cat": "Espaço", "fornecedor": "Lacustre Hall", "pessoas": 600, "local": "Asa Sul", "duracao": "5 horas", "validade": "15 dias", "pagamento": "30% no contrato + parcelado", "contato": "(61) 9 9949-7879", "itens": [["Locação 6ª ou sábado (jan e nov/27)", 28000]], "inclui": ["Salão climatizado com acessibilidade", "30 mesas redondas de 8 lugares", "Suíte VIP", "Estacionamento amplo gratuito", "Gerente, segurança, brigadistas e limpeza", "Gerador em stand-by"], "naoInclui": ["Buffet", "Decoração", "Som"], "adicionais": [["Gerador, se precisar ligar", 2300]], "alerta": "Buffet e decoração só de fornecedores cadastrados"}, {"id": 5, "cat": "Espaço", "fornecedor": "Villa Bé", "pessoas": 450, "local": "Gama", "duracao": "7 horas", "validade": "7 dias", "pagamento": "10% entrada + boleto", "contato": "—", "itens": [["Locação sábado ou feriado", 48000]], "inclui": ["Salão para até 450 convidados", "Gerador 170 kva e taxa de ECAD", "20 mesas de 8 lugares e 200 cadeiras", "Suíte da noiva e chalé do noivo", "160 vagas de estacionamento", "2 ensaios fotográficos"], "naoInclui": ["Buffet", "Decoração", "Brigadistas"], "adicionais": [], "alerta": "Proposta válida por 7 dias"}, {"id": 6, "cat": "Espaço", "fornecedor": "Green Park", "pessoas": 150, "local": "Park Way", "duracao": "6 horas", "validade": "—", "pagamento": "—", "contato": "(61) 99982-7981 · Wilson", "itens": [["Locação até 100 convidados", 10900], ["50 convidados adicionais (× R$ 50)", 2500]], "inclui": ["Salão, cozinha, churrasqueira e bar", "Gazebo e área gramada para cerimônia", "Mobiliário rústico completo", "Passarela e porta de madeira para cerimônia", "Sala para maquiagem da noiva"], "naoInclui": ["Buffet", "Decoração", "Gerador"], "adicionais": [["Taxa de ECAD", 750]], "alerta": "Limite máximo de 150 convidados"}, {"id": 7, "cat": "Espaço + decoração", "fornecedor": "Maison Daniela", "pessoas": 130, "local": "—", "duracao": "6 horas", "validade": "3 dias úteis", "pagamento": "Pix ou boleto · 50% + 50%", "contato": "(61) 99183-4477", "itens": [["Pacote Espaço + Decoração (até 130)", 18980]], "inclui": ["Espaço coberto e ao ar livre", "Lago, praia artificial e jardins", "250 cadeiras e 30 mesas", "Decoração da cerimônia e da recepção", "Camarim e sala de making of", "Cozinha industrial"], "naoInclui": ["Buffet", "Som", "Taxa de staff"], "adicionais": [["Taxa de staff", 800]], "alerta": "Até 40% de desconto de 2ª a 5ª · 10% às 6ª e domingos"}, {"id": 8, "cat": "Buffet", "fornecedor": "Castro's Buffet", "pessoas": 180, "local": "Vicente Pires", "duracao": "5 horas", "validade": "tabela 2026", "pagamento": "Parcelado até o evento", "contato": "(61) 4141-3086 · Erick", "itens": [["Coquetel volante (180 × R$ 134)", 24120]], "inclui": ["Coquetel volante durante todo o evento", "15 sabores de salgados", "Bebidas não alcoólicas", "1 garçom para cada 14 convidados", "Louça, prataria e material completo", "3 cortesias à escolha"], "naoInclui": ["Jantar (é ilha adicional)", "Bolo e doces", "Bebida alcoólica"], "adicionais": [["Ilha de jantar (180 × R$ 44)", 7920], ["Bolo e doces (180 × R$ 26,50)", 4770], ["Ilha de grelhados (180 × R$ 46)", 8280], ["Cerveja Antártica (180 × R$ 14)", 2520]], "alerta": "Tabela 2026 — reajuste de 10% para 2027 · crianças até 8 anos não pagam"}];
const S={modelo:1,adicionais:{},escolhida:{}};
O.forEach(o=>{S.adicionais[o.id]={};});
const R$=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=o=>o.itens.reduce((s,i)=>s+i[1],0);
const extras=o=>o.adicionais.reduce((s,a,i)=>s+(S.adicionais[o.id][i]?a[1]:0),0);
const total=o=>base(o)+extras(o);
const porPessoa=o=>o.pessoas?total(o)/o.pessoas:0;

/* ---------- MODELO 1 ---------- */
function m1(){
  return `<div class="nota"><b>Modelo 1 &mdash; ficha completa.</b> Cada orcamento vira uma ficha com tudo o que a proposta traz: o que inclui, o que nao inclui, adicionais, validade e contato. O valor por pessoa e calculado sozinho.</div>`
  + ['Pacote completo','Espaco','Espaco + decoracao','Buffet'].map(c=>{
      const lista=O.filter(o=>o.cat.replace('ç','c').replace('ã','a')===c||o.cat===c);
      if(!lista.length) return '';
      return `<div class="secao-titulo">${esc(lista[0].cat)}</div>`+lista.map(o=>`
      <details class="orc">
        <summary>
          <div class="oc-topo">
            <div style="min-width:0">
              <div class="oc-nome">${esc(o.fornecedor)}</div>
              <div class="oc-sub"><span class="tag pp">${o.pessoas} pessoas</span>${o.local!=='—'?'<span>'+esc(o.local)+'</span>':''}</div>
            </div>
            <div><div class="oc-val">${R$(base(o))}</div>
              <div class="oc-pp">${R$(base(o)/o.pessoas)} por pessoa</div></div>
          </div>
        </summary>
        <div class="corpo">
          ${o.itens.length>1?`<div class="bloco"><div class="bt">Composicao</div>
            ${o.itens.map(i=>`<div class="linhav"><span>${esc(i[0])}</span><b>${R$(i[1])}</b></div>`).join('')}
            <div class="total"><span>Total</span><b>${R$(base(o))}</b></div></div>`:''}
          <div class="bloco"><div class="bt">O que inclui</div>
            ${o.inclui.map(t=>`<div class="li"><span class="mk">&#10003;</span><span>${esc(t)}</span></div>`).join('')}</div>
          ${o.naoInclui.length?`<div class="bloco"><div class="bt">Nao incluso</div>
            ${o.naoInclui.map(t=>`<div class="li"><span class="mk no">&times;</span><span>${esc(t)}</span></div>`).join('')}</div>`:''}
          ${o.adicionais.length?`<div class="bloco"><div class="bt">Adicionais disponiveis</div>
            ${o.adicionais.map(a=>`<div class="linhav"><span>${esc(a[0])}</span><b>${R$(a[1])}</b></div>`).join('')}</div>`:''}
          <div class="bloco"><div class="bt">A proposta</div>
            <dl class="ficha">
              <dt>Duracao</dt><dd>${esc(o.duracao)}</dd>
              <dt>Validade</dt><dd>${esc(o.validade)}</dd>
              <dt>Pagamento</dt><dd>${esc(o.pagamento)}</dd>
              <dt>Contato</dt><dd>${esc(o.contato)}</dd>
            </dl></div>
          ${o.alerta?`<div class="alerta">${esc(o.alerta)}</div>`:''}
        </div>
      </details>`).join('');
    }).join('');
}

/* ---------- MODELO 2 ---------- */
function m2(){
  return `<div class="nota"><b>Modelo 2 &mdash; simulador.</b> Os adicionais tem chave liga/desliga. O total do orcamento e o valor por pessoa recalculam na hora, entao da pra montar cenarios antes de decidir.</div>`
  + O.filter(o=>o.adicionais.length).map(o=>{
    const lig=o.adicionais.filter((a,i)=>S.adicionais[o.id][i]).length;
    return `<details class="orc" ${o.id===1?'open':''}>
      <summary>
        <div class="oc-topo">
          <div style="min-width:0">
            <div class="oc-nome">${esc(o.fornecedor)}</div>
            <div class="oc-sub"><span class="tag pp">${o.pessoas} pessoas</span>
              ${lig?`<span class="tag ok">+${lig} adicional(is)</span>`:'<span>so o pacote base</span>'}</div>
          </div>
          <div><div class="oc-val">${R$(total(o))}</div>
            <div class="oc-pp">${R$(porPessoa(o))} por pessoa</div></div>
        </div>
      </summary>
      <div class="corpo">
        <div class="bloco"><div class="bt">Pacote base</div>
          ${o.itens.map(i=>`<div class="linhav"><span>${esc(i[0])}</span><b>${R$(i[1])}</b></div>`).join('')}
          <div class="total"><span>Subtotal</span><b>${R$(base(o))}</b></div></div>
        <div class="bloco"><div class="bt">Adicionais &mdash; ligue o que quiser somar</div>
          ${o.adicionais.map((a,i)=>`<div class="add">
            <button class="sw ${S.adicionais[o.id][i]?'on':''}" onclick="tog(${o.id},${i})" aria-label="${esc(a[0])}"></button>
            <span class="nm">${esc(a[0])}</span><b>${R$(a[1])}</b></div>`).join('')}
          ${extras(o)?`<div class="total"><span>Somado</span><b>${R$(extras(o))}</b></div>`:''}</div>
        <div class="cartao" style="margin:0;background:var(--papel);border-style:dashed">
          <div style="display:flex;justify-content:space-between;align-items:flex-end">
            <div><span class="rot">Total com os adicionais</span><b class="val">${R$(total(o))}</b></div>
            <div style="text-align:right"><span class="rot">Por pessoa</span>
              <b class="val" style="font-size:16px;color:var(--cinza)">${R$(porPessoa(o))}</b></div>
          </div>
        </div>
        <button class="btn ${S.escolhida[o.id]?'on':''}" onclick="escolher(${o.id})">
          ${S.escolhida[o.id]?'&#10003; Escolhido':'Marcar como escolhido'}</button>
      </div>
    </details>`;}).join('');
}

/* ---------- MODELO 3 ---------- */
function m3(){
  const c=[O[0],O[1],O[2]];
  const menor=Math.min.apply(null,c.map(o=>porPessoa(o)));
  const lin=(rot,fn)=>`<tr><td>${rot}</td>${c.map(o=>`<td>${fn(o)}</td>`).join('')}</tr>`;
  const temItem=(o,t)=>o.inclui.concat(o.itens.map(i=>i[0])).join(' ').toLowerCase().indexOf(t)>=0
    ? '<span class="sim">&#10003;</span>' : '<span class="nao">&times;</span>';
  return `<div class="nota"><b>Modelo 3 &mdash; comparador.</b> Poe os orcamentos lado a lado nas mesmas linhas. Serve para bater o que um tem e o outro nao, sem precisar abrir proposta por proposta.</div>
  <div class="cartao">
    <table class="cmp">
      <thead><tr><th></th>${c.map(o=>`<th>${esc(o.fornecedor)}</th>`).join('')}</tr></thead>
      <tbody>
        ${lin('Pessoas',o=>'<span class="num">'+o.pessoas+'</span>')}
        ${lin('Valor',o=>'<span class="num">'+R$(base(o))+'</span>')}
        ${lin('Por pessoa',o=>'<span class="num '+(porPessoa(o)===menor?'best':'')+'">'+R$(porPessoa(o))+'</span>')}
        ${lin('Buffet',o=>temItem(o,'buffet'))}
        ${lin('Decoracao',o=>temItem(o,'decora'))}
        ${lin('Som e DJ',o=>temItem(o,'som'))}
        ${lin('Bolo e doces',o=>temItem(o,'doce'))}
        ${lin('Cerimonia',o=>temItem(o,'cerim'))}
        ${lin('Gerador',o=>temItem(o,'gerador'))}
        ${lin('Validade',o=>esc(o.validade))}
      </tbody>
    </table>
    <div class="rodape" style="border-top:1px solid var(--linha);margin-top:10px;padding-top:10px">
      Em verde, o menor custo por pessoa. Os valores nao sao diretamente comparaveis porque cobrem quantidades diferentes de convidados.
    </div>
  </div>
  <div class="secao-titulo">Falta somar em cada um</div>
  ${c.map(o=>`<div class="cartao" style="padding:12px 14px">
    <div style="font-weight:600;font-size:14px;margin-bottom:6px">${esc(o.fornecedor)}</div>
    ${o.naoInclui.map(t=>`<div class="li"><span class="mk no">&times;</span><span>${esc(t)}</span></div>`).join('')}
    ${o.adicionais.length?`<div style="font-size:12px;color:var(--cinza);margin-top:8px">
      Adicionais somam ate <b style="color:var(--tinta)">${R$(o.adicionais.reduce((s,a)=>s+a[1],0))}</b></div>`:''}
  </div>`).join('')}`;
}

function tog(id,i){S.adicionais[id][i]=!S.adicionais[id][i];render();}
function escolher(id){S.escolhida[id]=!S.escolhida[id];render();}
function render(){
  document.getElementById('mods').innerHTML=[[1,'Ficha completa'],[2,'Simulador'],[3,'Comparador']].map(m=>
    `<button aria-pressed="${S.modelo===m[0]}" onclick="S.modelo=${m[0]};render();window.scrollTo(0,0)">${m[1]}</button>`).join('');
  document.getElementById('tela').innerHTML=S.modelo===1?m1():S.modelo===2?m2():m3();
}
render();
</script>
