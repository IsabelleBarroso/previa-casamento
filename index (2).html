<style>
:root{
  --tinta:#12322A; --tinta2:#1D4A3E;
  --papel:#F2EEE4; --carta:#FFFFFF;
  --rosa:#B4566A; --ouro:#BE8724; --cinza:#6E7C74;
  --linha:rgba(18,50,42,.13);
  --display:'Fraunces',Georgia,serif;
  --texto:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--tinta);font-family:var(--texto);color:var(--tinta);font-size:15px;line-height:1.45}
#shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--papel);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:86px;position:relative}

header{background:var(--tinta);color:var(--papel);padding:20px 20px 20px}
header.casamento{background:#3B1B27}
.eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(242,238,228,.6);margin:0 0 6px;font-weight:500}
header h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
.headline{margin-top:13px;border-top:1px solid rgba(242,238,228,.18);padding-top:12px;display:flex;align-items:baseline;gap:9px}
.headline b{font-family:var(--display);font-size:31px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.headline span{font-size:12px;color:rgba(242,238,228,.7)}

main{padding:16px 16px 8px}
.secao-titulo{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:22px 2px 9px}
.secao-titulo:first-child{margin-top:2px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:11px}

.topo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.val{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-.02em;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.barra{height:11px;border-radius:99px;background:rgba(18,50,42,.09);display:flex;overflow:hidden}
.barra i{display:block;height:100%}
.legenda{display:flex;gap:15px;margin-top:11px;flex-wrap:wrap}
.legenda div{font-size:11.5px;color:var(--cinza);display:flex;align-items:center;gap:6px}
.legenda em{width:8px;height:8px;border-radius:99px;display:inline-block;font-style:normal}
.legenda b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mini{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:13px 14px}
.mini .num{font-family:var(--display);font-size:22px;font-weight:500;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini .pe{font-size:11.5px;color:var(--cinza);margin-top:1px}

.linha-item{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center}
.linha-item .corpo{flex:1;min-width:0}
.linha-item .nome{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-item .sub{font-size:12px;color:var(--cinza);margin-top:2px}
.linha-item .valor{font-family:var(--display);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}

.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(18,50,42,.07);color:var(--cinza)}
.tag.noiva{background:rgba(180,86,106,.12);color:var(--rosa)}
.tag.noivo{background:rgba(29,74,62,.12);color:var(--tinta2)}
.tag.ok{background:rgba(190,135,36,.15);color:#8A6212}

.x{border:0;background:transparent;color:var(--cinza);font-size:20px;line-height:1;padding:4px 6px;border-radius:8px;cursor:pointer;flex:none}
.x:hover{background:rgba(180,86,106,.12);color:var(--rosa)}

.cat{background:var(--carta);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
.cat>summary::-webkit-details-marker{display:none}
.cat .cnome{font-weight:600;flex:1}
.cat .cval{font-family:var(--display);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.cat .seta{color:var(--cinza);font-size:12px;transition:transform .18s}
.cat[open] .seta{transform:rotate(90deg)}
.cot{border-top:1px solid var(--linha);padding:12px 14px;display:flex;gap:10px;align-items:center}
.cot.bloco{display:block}
.cot.escolhida{background:rgba(190,135,36,.08);box-shadow:inset 3px 0 0 var(--ouro)}
.marca{width:19px;height:19px;border-radius:99px;border:1.5px solid var(--linha);flex:none;cursor:pointer;background:transparent;padding:0}
.cot-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cot-acoes{display:flex;gap:8px;align-items:center;margin-top:10px}
.escolher{
  border:1px solid var(--linha);background:transparent;color:var(--tinta);
  padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:var(--texto);white-space:nowrap;
}
.escolher:hover{border-color:var(--ouro);color:#8A6212}
.escolher.on{background:var(--ouro);border-color:var(--ouro);color:#fff}
.escolher.on:hover{color:#fff}
.apagar{
  border:0;background:transparent;color:var(--cinza);font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--texto);padding:7px 8px;border-radius:8px;margin-left:auto;
}
.apagar:hover{color:var(--rosa);background:rgba(180,86,106,.1)}
.selo{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:#8A6212;background:rgba(190,135,36,.16);
  padding:4px 8px;border-radius:6px;
}

.form{background:var(--carta);border:1px dashed rgba(18,50,42,.25);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:0 0 5px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--linha);border-radius:10px;font-family:var(--texto);font-size:14.5px;color:var(--tinta);background:var(--papel)}
input:focus,select:focus{outline:2px solid var(--tinta2);outline-offset:1px}
.campo{margin-bottom:10px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--tinta);color:var(--papel);font-family:var(--texto);font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--tinta2)}
.btn.claro{background:transparent;color:var(--tinta);border:1px solid var(--linha)}
.btn.rosa{background:#3B1B27}

.chips{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:transparent;color:var(--cinza);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--texto)}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip.rosa[aria-pressed="true"]{background:#3B1B27;border-color:#3B1B27}

.mes{font-family:var(--display);font-size:15px;font-weight:500;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.mes span{font-family:var(--texto);font-size:12px;color:var(--cinza);font-variant-numeric:tabular-nums}
.vazio{text-align:center;color:var(--cinza);font-size:13.5px;padding:26px 14px;border:1px dashed var(--linha);border-radius:14px}

.hbar{margin-bottom:11px}
.hbar .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .l b{font-variant-numeric:tabular-nums;font-weight:600}
.hbar .t{height:8px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}

table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:right;padding:0 0 7px;font-weight:600}
table.res th:first-child{text-align:left}
table.res td{padding:8px 0;border-top:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums}
table.res td:first-child{text-align:left;font-weight:500}

nav{position:fixed;bottom:0;left:0;right:0;max-width:470px;margin:0 auto;background:var(--carta);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:13px 2px 15px;cursor:pointer;font-family:var(--texto);font-size:11px;font-weight:600;color:var(--cinza);position:relative}
nav button[aria-current="true"]{color:var(--tinta)}
nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2px;background:var(--tinta);border-radius:0 0 3px 3px}
nav button.cas[aria-current="true"]{color:#3B1B27}
nav button.cas[aria-current="true"]::before{background:var(--rosa)}
nav .divisor{width:1px;background:var(--linha);margin:12px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="shell">
  <header id="cab">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="titulo"></h1>
    <div class="headline"><b id="hNum"></b><span id="hTxt"></span></div>
  </header>
  <main id="tela"></main>

</div>

<script>
/* ===================== estado (dados de demonstração) ===================== */
const S = {

    {id:15,desc:'Dentista',valor:900,data:'2026-02-18',cat:'Saúde',forma:'pix',parcelado:false,parcelas:1},

  ],

  categorias:[

      {id:9,fornecedor:'DJ Rick',valor:3200,obs:'som + pista',escolhida:false,pago:0}]},
    {id:205,nome:'Fotografia e vídeo',cotacoes:[
      {id:10,fornecedor:'Studio Reveler',valor:7400,obs:'pré-wedding incluso',escolhida:true,pago:1500}]},
    {id:206,nome:'Decoração e flores',cotacoes:[
      {id:11,fornecedor:'Flor de Liz',valor:9800,obs:'',escolhida:false,pago:0},
      {id:12,fornecedor:'Ateliê Bocage',valor:11200,obs:'flores naturais',escolhida:false,pago:0}]},
    {id:207,nome:'Vestido e traje',cotacoes:[
      {id:13,fornecedor:'Casa Blanca Noivas',valor:6900,obs:'aluguel + prova',escolhida:true,pago:3450}]},
    {id:208,nome:'Bolo e doces',cotacoes:[]},
    {id:209,nome:'Convites',cotacoes:[]},
    {id:210,nome:'Cerimonial',cotacoes:[]}
  ]
};
let seq=900; const novoId=()=>++seq;

/* ===================== utilidades ===================== */
const R$ = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const curto = v => 'R$ '+Math.round(v).toLocaleString('pt-BR');
const hoje = new Date('2026-07-29T12:00:00');
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const M3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const FORMAS={credito:'Crédito',debito:'Débito',pix:'Pix',dinheiro:'Dinheiro'};
const COR_FORMA={credito:'#B4566A',debito:'#1D4A3E',pix:'#BE8724',dinheiro:'#6E7C74'};
const CATS=['Mercado','Alimentação','Transporte','Casa','Saúde','Lazer','Vestuário','Outros'];
const dataBR = s => { const [a,m,d]=s.split('-'); return d+'/'+m; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parcelasDe(g){
  const out=[]; const [a,m,d]=g.data.split('-').map(Number); const v=g.valor/g.parcelas;
  for(let i=0;i<g.parcelas;i++){
    const dt=new Date(a,m-1+i,d);
    out.push({chave:g.id+'-'+(i+1),desc:g.desc,n:i+1,de:g.parcelas,valor:v,dt,forma:g.forma,cat:g.cat});
  }
  return out;
}
const todasParcelas = () => S.gastos.filter(g=>g.parcelado).flatMap(parcelasDe).sort((x,y)=>x.dt-y.dt);

/* fluxo real do mês: à vista no mês da compra + parcelas caindo no mês */
function fluxoMes(chave){
  let t=0;
  S.gastos.forEach(g=>{
    if(!g.parcelado){ if(g.data.slice(0,7)===chave) t+=g.valor; }
    else parcelasDe(g).forEach(p=>{
      const k=p.dt.getFullYear()+'-'+String(p.dt.getMonth()+1).padStart(2,'0');
      if(k===chave) t+=p.valor;
    });
  });
  return t;
}
function itensDoMes(chave){
  const out=[];
  S.gastos.forEach(g=>{
    if(!g.parcelado){ if(g.data.slice(0,7)===chave) out.push({g,valor:g.valor,rot:'à vista'}); }
    else parcelasDe(g).forEach(p=>{
      const k=p.dt.getFullYear()+'-'+String(p.dt.getMonth()+1).padStart(2,'0');
      if(k===chave) out.push({g,valor:p.valor,rot:`parcela ${p.n}/${p.de}`});
    });
  });
  return out;
}
function totaisCasamento(){
  let contratado=0,pago=0;
  S.categorias.forEach(c=>{const e=c.cotacoes.find(q=>q.escolhida); if(e){contratado+=e.valor; pago+=(e.pago||0);}});
  const pessoas=S.convidados.filter(c=>c.status!=='recusou').reduce((s,c)=>s+1+c.acomp,0);
  const confirmadas=S.convidados.filter(c=>c.status==='confirmado').reduce((s,c)=>s+1+c.acomp,0);
  return {contratado,pago,falta:Math.max(contratado-pago,0),pessoas,confirmadas};
}

/* ===================== FINANCEIRO ===================== */
function telaInicio(){
  const totalMes=fluxoMes('2026-07'), totalAnt=fluxoMes('2026-06');
  const dif = totalAnt? ((totalMes-totalAnt)/totalAnt)*100 : 0;
  const itens=itensDoMes('2026-07');
  const porForma={}; itens.forEach(i=>porForma[i.g.forma]=(porForma[i.g.forma]||0)+i.valor);
  const abertas=todasParcelas().filter(p=>!S.parcelasPagas.has(p.chave));
  const proximas=abertas.filter(p=>p.dt>=hoje).slice(0,3);

  return `
  <div class="secao-titulo">Julho de 2026</div>
  <div class="cartao">
    <div class="topo">
      <div><span class="rot">Gasto no mês</span><b class="val">${R$(totalMes)}</b></div>
      <div style="text-align:right"><span class="rot">vs. junho</span>
        <b class="val" style="font-size:17px;color:${dif>0?'var(--rosa)':'var(--tinta2)'}">${dif>0?'+':''}${dif.toFixed(0)}%</b></div>
    </div>
    <div class="barra">
      ${Object.keys(FORMAS).map(k=>`<i style="width:${((porForma[k]||0)/(totalMes||1))*100}%;background:${COR_FORMA[k]}"></i>`).join('')}
    </div>
    <div class="legenda">
      ${Object.keys(FORMAS).map(k=>`<div><em style="background:${COR_FORMA[k]}"></em>${FORMAS[k]} <b>${R$(porForma[k]||0)}</b></div>`).join('')}
    </div>
  </div>

  <div class="grade">
    <div class="mini"><div class="rot">Fatura do cartão</div><div class="num">${R$(porForma.credito||0)}</div><div class="pe">crédito de julho</div></div>
    <div class="mini"><div class="rot">Parcelas em aberto</div><div class="num">${R$(abertas.reduce((s,p)=>s+p.valor,0))}</div><div class="pe">${abertas.length} parcelas</div></div>
    <div class="mini"><div class="rot">Lançamentos</div><div class="num">${itens.length}</div><div class="pe">no mês</div></div>
    <div class="mini"><div class="rot">Média por dia</div><div class="num">${R$(totalMes/31)}</div><div class="pe">julho</div></div>
  </div>

  <div class="secao-titulo">Próximas parcelas</div>
  ${proximas.length?proximas.map(p=>`

function listaParcelas(){
  const ps=todasParcelas(), grupos={};
  ps.forEach(p=>{const k=p.dt.getFullYear()+'-'+String(p.dt.getMonth()+1).padStart(2,'0');(grupos[k]=grupos[k]||[]).push(p)});
  const chaves=Object.keys(grupos).sort();
  const aberto=ps.filter(p=>!S.parcelasPagas.has(p.chave)).reduce((s,p)=>s+p.valor,0);
  return `
  <div class="cartao">
    <div class="topo"><div><span class="rot">Em aberto</span><b class="val">${R$(aberto)}</b></div></div>
    <div style="font-size:12.5px;color:var(--cinza)">Cada compra parcelada cai automaticamente nos meses seguintes. Toque no círculo para marcar como paga.</div>
  </div>
  ${chaves.length?chaves.map(k=>{
    const [a,m]=k.split('-'); const soma=grupos[k].reduce((s,p)=>s+p.valor,0);
    return `<div class="mes">${MESES[+m-1]} de ${a}<span>${R$(soma)}</span></div>
    ${grupos[k].map(p=>{const pg=S.parcelasPagas.has(p.chave);return `
      <div class="linha-item" style="${pg?'opacity:.55':''}">

        <div class="corpo"><div class="nome">${esc(p.desc)}</div><div class="sub">parcela ${p.n} de ${p.de} · ${FORMAS[p.forma]}</div></div>

      </div>`}).join('')}`;
  }).join(''):'<div class="vazio">Nenhuma compra parcelada lançada.</div>'}`;
}

function telaGrafico(){
  /* 6 meses */
  const chaves=[]; for(let i=5;i>=0;i--){const d=new Date(2026,6-i,1);chaves.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),r:M3[d.getMonth()]})}
  const vals=chaves.map(c=>fluxoMes(c.k));
  const maxV=Math.max(...vals,1);
  const W=340,H=150,bw=34,gap=(W-chaves.length*bw)/(chaves.length+1);
  const barras=chaves.map((c,i)=>{
    const h=Math.max((vals[i]/maxV)*105,3), x=gap+i*(bw+gap), y=118-h;
    const atual=c.k==='2026-07';
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${atual?'#12322A':'rgba(18,50,42,.22)'}"></rect>
      <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="9.5" font-family="Inter" fill="#6E7C74">${Math.round(vals[i]/100)/10}k</text>
      <text x="${x+bw/2}" y="134" text-anchor="middle" font-size="11" font-family="Inter" font-weight="${atual?600:400}" fill="${atual?'#12322A':'#6E7C74'}">${c.r}</text>`;
  }).join('');

  /* donut por forma de pagamento — mês atual */
  const itens=itensDoMes('2026-07'); const tot=itens.reduce((s,i)=>s+i.valor,0)||1;
  const porForma={}; itens.forEach(i=>porForma[i.g.forma]=(porForma[i.g.forma]||0)+i.valor);
  const C=2*Math.PI*44; let off=0;
  const aneis=Object.keys(FORMAS).map(k=>{
    const frac=(porForma[k]||0)/tot, len=frac*C;
    const el=`<circle cx="60" cy="60" r="44" fill="none" stroke="${COR_FORMA[k]}" stroke-width="15"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"></circle>`;
    off+=len; return el;
  }).join('');

  /* categorias do mês */
  const porCat={}; itens.forEach(i=>porCat[i.g.cat]=(porCat[i.g.cat]||0)+i.valor);
  const ordenadas=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxC=ordenadas.length?ordenadas[0][1]:1;

  return `
  <div class="secao-titulo">Últimos 6 meses</div>
  <div class="cartao">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gastos dos últimos seis meses">${barras}</svg>
    <div style="font-size:12px;color:var(--cinza);border-top:1px solid var(--linha);padding-top:10px">
      Média mensal <b style="color:var(--tinta)">${R$(vals.reduce((s,v)=>s+v,0)/vals.length)}</b>
    </div>
  </div>

  <div class="secao-titulo">Como você pagou em julho</div>
  <div class="cartao" style="display:flex;gap:14px;align-items:center">
    <svg viewBox="0 0 120 120" width="118" height="118" style="flex:none">
      ${aneis}
      <text x="60" y="56" text-anchor="middle" font-size="9" font-family="Inter" fill="#6E7C74" letter-spacing="1">TOTAL</text>
      <text x="60" y="72" text-anchor="middle" font-size="14" font-family="Fraunces" fill="#12322A">${curto(tot)}</text>
    </svg>
    <div style="flex:1">
      ${Object.keys(FORMAS).map(k=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px">
        <span style="color:var(--cinza)"><em style="display:inline-block;width:8px;height:8px;border-radius:99px;background:${COR_FORMA[k]};margin-right:6px"></em>${FORMAS[k]}</span>
        <b style="font-variant-numeric:tabular-nums">${((porForma[k]||0)/tot*100).toFixed(0)}%</b></div>`).join('')}
    </div>
  </div>

  <div class="secao-titulo">Onde o dinheiro foi</div>
  <div class="cartao">
    ${ordenadas.length?ordenadas.map(([c,v])=>`
      <div class="hbar"><div class="l"><span>${esc(c)}</span><b>${R$(v)}</b></div>
      <div class="t"><i style="width:${(v/maxC)*100}%;background:var(--tinta2)"></i></div></div>`).join('')
      :'<div class="vazio">Sem gastos no mês.</div>'}
  </div>`;
}

function addGasto(){
  const d=document.getElementById('gDesc').value.trim(), v=parseFloat(document.getElementById('gValor').value);
  if(!d||!(v>0)) return alert('Preencha descrição e valor.');
  const parcelado=document.getElementById('gParc').value==='parcelado';
  S.gastos.push({id:novoId(),desc:d,valor:v,data:document.getElementById('gData').value,
    cat:document.getElementById('gCat').value,forma:document.getElementById('gForma').value,
    parcelado,parcelas:parcelado?Math.max(2,+document.getElementById('gN').value||2):1});
  render();
}
function apagarGasto(id){ S.gastos=S.gastos.filter(g=>g.id!==id); render(); }
function togglePaga(k){ S.parcelasPagas.has(k)?S.parcelasPagas.delete(k):S.parcelasPagas.add(k); render(); }

function addConv(){
  const n=document.getElementById('cNome').value.trim();
  if(!n) return alert('Escreva o nome do convidado.');
  S.convidados.push({id:novoId(),nome:n,lado:document.getElementById('cLado').value,
    grupo:document.getElementById('cGrupo').value.trim()||'Outros',
    acomp:+document.getElementById('cAcomp').value||0,status:document.getElementById('cStatus').value});
  render();
}
function apagarConv(id){ S.convidados=S.convidados.filter(c=>c.id!==id); render(); }
function ciclarStatus(id){
  const o=['pendente','confirmado','recusou'], c=S.convidados.find(x=>x.id===id);
  c.status=o[(o.indexOf(c.status)+1)%3]; render();
}
function escolher(catId,cotId){
  const c=S.categorias.find(x=>x.id===catId), era=c.cotacoes.find(q=>q.id===cotId).escolhida;
  c.cotacoes.forEach(q=>q.escolhida=false);
  if(!era) c.cotacoes.find(q=>q.id===cotId).escolhida=true;
  render(catId);
}
function addCot(catId){
  const f=document.getElementById('f'+catId).value.trim(), v=parseFloat(document.getElementById('v'+catId).value);
  if(!f||!(v>=0)) return alert('Preencha fornecedor e valor.');
  S.categorias.find(x=>x.id===catId).cotacoes.push({id:novoId(),fornecedor:f,valor:v,obs:document.getElementById('o'+catId).value.trim(),escolhida:false,pago:0});
  render(catId);
}
function apagarCot(catId,cotId){
  const c=S.categorias.find(x=>x.id===catId); c.cotacoes=c.cotacoes.filter(q=>q.id!==cotId); render(catId);
}
function addCat(){
  const n=document.getElementById('novaCat').value.trim();
  if(!n) return alert('Dê um nome para a categoria.');
  S.categorias.push({id:novoId(),nome:n,cotacoes:[]}); render();
}
function setPago(catId,cotId,v){
  const q=S.categorias.find(c=>c.id===catId).cotacoes.find(x=>x.id===cotId);
  q.pago=Math.min(Math.max(+v||0,0),q.valor); render();
}

/* ===================== render ===================== */
const ABAS=[['inicio','Início',telaInicio],['gastos','Gastos',telaGastos],
            ['grafico','Gráfico',telaGrafico],['casamento','Casamento',telaCasamento]];

function render(abrirCat){
  const aba=ABAS.find(a=>a[0]===S.aba);
  document.getElementById('tela').innerHTML=aba[2]();
  document.getElementById('nav').innerHTML=
    ABAS.slice(0,3).map(a=>`<button aria-current="${a[0]===S.aba}" onclick="ir('${a[0]}')">${a[1]}</button>`).join('')
    +'<div class="divisor"></div>'
    +`<button class="cas" aria-current="${S.aba==='casamento'}" onclick="ir('casamento')">Casamento</button>`;

  const cas=S.aba==='casamento';
  document.getElementById('cab').className=cas?'casamento':'';
  document.getElementById('eyebrow').textContent=cas?'Casamento':'Financeiro';
  document.getElementById('titulo').textContent=cas?S.noivos:'Minhas finanças';
  if(cas){
    const alvo=new Date(S.dataCasamento+'T12:00:00');
    const [a,m,d]=S.dataCasamento.split('-');
    document.getElementById('hNum').textContent=Math.round((alvo-hoje)/86400000);
    document.getElementById('hTxt').textContent=`dias para ${d} de ${MESES[+m-1]} de ${a}`;
  }else{
    document.getElementById('hNum').textContent=R$(fluxoMes('2026-07'));
    document.getElementById('hTxt').textContent='gastos de julho';
  }
  if(abrirCat){
    const el=document.querySelectorAll('.cat')[S.categorias.findIndex(c=>c.id===abrirCat)];
    if(el){el.open=true; el.scrollIntoView({block:'center'});}
  }
}
function ir(a){ S.aba=a; render(); window.scrollTo(0,0); }
render();
</script>
